  .home__foot { text-align: center; font-size: 11px; color: #3f4a5e; margin-top: 26px; font-family: 'JetBrains Mono', monospace; }

                React.createElement(Row, { c: "#0ea5e9", label: "Scleroderma (systemic sclerosis) oesophagus", val: "Progressive replacement of the smooth muscle in the distal two-thirds of the oesophagus with fibrous tissue produces weak or absent peristalsis there, while the proximal, striated-muscle third (under different neuromuscular control) is relatively spared \u2014 combined with a low, incompetent lower oesophageal sphincter pressure, this produces severe reflux disease and an oesophagus that empties poorly by gravity alone, a distinctive combination that should prompt consideration of underlying systemic sclerosis, particularly alongside other suggestive features (Raynaud's, skin changes, sclerodactyly)." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83E\uDDED" }, "A Structured Approach to Dysphagia"),
                React.createElement(Table, { color: "#0ea5e9", headers: ["Branch point", "What it tells you"], rows: [
                        ["Oropharyngeal vs oesophageal localisation", "Oropharyngeal dysphagia (difficulty initiating a swallow, coughing or choking immediately on swallowing, nasal regurgitation) points toward a neurological or structural problem at the pharyngeal level (stroke, myasthenia, pharyngeal pouch). Oesophageal dysphagia (food sticking after an apparently normal swallow has been initiated) points toward a problem further down the tract"],
                        ["Solid-only vs solid-and-liquid dysphagia", "Solids only, particularly if progressive, points toward a mechanical/structural cause (stricture, tumour, ring), since a food bolus of sufficient size is needed to trigger symptoms. Both solids and liquids from the outset points toward a motility disorder (achalasia or the conditions above), since these affect coordinated muscular passage regardless of consistency"],
                    ] }),
                React.createElement(Tip, null, "These two branch points, obtainable from history alone, are often enough to direct the first investigation \u2014 endoscopy for suspected structural disease, or barium swallow/manometry for suspected motility disease \u2014 before any test is performed."),
                React.createElement(Ref, null, "Standard surgical/gastroenterology teaching (Bailey & Love; Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-2", title: "Peptic Ulcer Disease \u2014 Aetiology & Diagnosis", icon: "\uD83D\uDD73\uFE0F", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Accounts for the majority of peptic ulcers overall, colonising the gastric antral mucosa and disrupting the normal mucus-bicarbonate protective barrier while also driving chronic gastritis \u2014 duodenal ulcers are more."),
                React.createElement(Row, { label: "H. pylori", val: "Strongly H. pylori-associated than gastric ulcers, and eradication therapy (a proton pump inhibitor plus two antibiotics, typically amoxicillin and clarithromycin, or metronidazole in penicillin allergy) both heals the ulcer and dramatically reduces recurrence compared with acid suppression alone." }),
                React.createElement(Row, { c: "#0ea5e9", label: "NSAIDs", val: "Reduce mucosal defence by inhibiting COX-1-mediated protective prostaglandin synthesis (which normally stimulates mucus and bicarbonate secretion and maintains mucosal blood flow) \u2014 risk rises with dose, duration, concurrent corticosteroid or anticoagulant use, and age, and co-prescription of a proton pump inhibitor is standard practice when NSAIDs cannot be avoided in at-risk patients." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Zollinger-Ellison syndrome", val: "A gastrin-secreting neuroendocrine tumour (gastrinoma), most often in the duodenum or pancreas, drives extreme, unregulated gastric acid hypersecretion \u2014 should be suspected with multiple, recurrent, or unusually distal (post-bulbar/jejunal) ulcers, ulcers resistant to standard therapy, or associated diarrhoea (from acid-mediated inactivation of pancreatic enzymes and direct mucosal injury); a fasting serum gastrin level (off proton pump inhibitors, which themselves raise gastrin) is the key screening test, and roughly a quarter of cases occur as part of MEN1 syndrome alongside parathyroid and pituitary tumours." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Duodenal vs gastric ulcer \u2014 a clinically useful distinction", val: "Duodenal ulcer pain classically improves with eating (food buffers acid reaching the already-healed duodenal mucosa) and recurs a few hours later as the stomach empties; gastric ulcer pain classically worsens with eating (food stimulates acid secretion against an already-compromised gastric mucosal barrier) \u2014 this distinction is a useful clinical heuristic though it is not reliable enough alone to avoid endoscopic confirmation." }),
                React.createElement(Ref, null, "Standard surgical/gastroenterology teaching (Bailey & Love; Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-3", title: "Peptic Ulcer Disease \u2014 Complications & Surgical Management", icon: "\uD83D\uDEA8", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "A duodenal (more common) or gastric ulcer erodes fully through the wall, spilling gastric content into the peritoneal cavity and producing sudden, severe abdominal pain rapidly becoming generalised, with a rigid."),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83D\uDCA5" }, "Perforation"),
                React.createElement(Row, { c: "#0ea5e9", label: "Presentation and confirmation", val: "Board-like abdomen \u2014 an erect chest X-ray showing free sub-diaphragmatic air confirms the diagnosis in the majority of cases, though a normal film does not exclude it, and CT is more sensitive if the diagnosis remains uncertain." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Management", val: "Resuscitation (IV fluids, broad-spectrum antibiotics, analgesia, nasogastric decompression) proceeds in parallel with urgent surgical assessment; surgical repair is most often an omental (Graham) patch over the perforation rather than formal ulcer resection in the acute setting, since the priority is source control in a physiologically stressed patient rather than definitive ulcer surgery, which can be addressed medically (H. pylori eradication, acid suppression) once the patient has recovered." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83E\uDE78" }, "Bleeding"),
                React.createElement(Row, { c: "#0ea5e9", label: "Mechanism", val: "Erosion into an underlying vessel \u2014 a posterior duodenal ulcer eroding into the gastroduodenal artery is the classical, most dangerous example given the volume of bleeding that vessel can produce \u2014 presents with haematemesis and/or melaena, or, if bleeding is brisk enough, haematochezia despite an upper GI source." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Risk stratification", val: "The Glasgow-Blatchford score, calculated from clinical and simple laboratory data (urea, haemoglobin, systolic BP, pulse, and the presence of melaena/syncope/hepatic disease/cardiac failure) before endoscopy, identifies patients at very low risk who may be safely managed as outpatients without admission; the Rockall score, incorporating endoscopic findings alongside clinical data, stratifies risk of rebleeding and mortality after endoscopy and guides the intensity of post-endoscopic monitoring." }),
                React.createElement(PillarCard, { n: 1, total: 3, color: "#0ea5e9", icon: "\uD83E\uDE79", title: "Endoscopic haemostasis \u2014 first line", body: "Adrenaline injection, thermal coagulation, and/or clipping, generally combining at least two modalities for high-risk stigmata." }),
                React.createElement(PillarCard, { n: 2, total: 3, color: "#0ea5e9", icon: "\uD83D\uDC8A", title: "Proton pump inhibitor therapy", body: "Reduces rebleeding risk by raising intragastric pH to stabilise clot." }),
                React.createElement(PillarCard, { n: 3, total: 3, color: "#0ea5e9", icon: "\uD83D\uDD2A", title: "Surgery or interventional radiology \u2014 for endoscopic failure", body: "Under-running/ligating the bleeding vessel, or rarely gastrectomy, or embolisation \u2014 reserved for endoscopic failure, rebleeding after initial successful endoscopy, or haemodynamic instability precluding safe endoscopy." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83D\uDEA7" }, "Gastric Outlet Obstruction (Acquired Pyloric Stenosis)"),
                React.createElement(Row, { c: "#0ea5e9", label: "Mechanism and presentation", val: "Chronic scarring and oedema from recurrent peptic ulceration at the pylorus or duodenal cap narrows the outlet, producing early satiety and non-bilious, projectile vomiting of previously ingested, sometimes days-old food (a useful discriminator from more proximal causes of vomiting) \u2014 a succussion splash on examination reflects retained gastric fluid and air." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Metabolic consequence", val: "Loss of gastric acid (hydrochloric acid) through vomiting, combined with renal compensation, produces a hypochloraemic, hypokalaemic metabolic alkalosis \u2014 the kidney initially tries to conserve sodium at the expense of hydrogen ion excretion (paradoxical aciduria) once potassium stores are depleted, a classically tested acid-base picture distinct from congenital pyloric stenosis of infancy despite the identical metabolic derangement and shared name." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Management", val: "Correction of fluid and electrolyte derangement (0.9% saline with potassium replacement) precedes any intervention; endoscopic balloon dilatation is first line for benign strictures, with surgery (gastrojejunostomy, or resection if malignancy cannot be excluded) reserved for dilatation failure or recurrent obstruction." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83C\uDF97\uFE0F" }, "Malignant Transformation"),
                React.createElement(Row, { c: "#0ea5e9", label: "Relevant specifically to gastric ulcers", val: "Duodenal ulcers essentially never transform to malignancy, but any gastric ulcer identified on endoscopy requires biopsy of the ulcer edge (multiple quadrants) and follow-up endoscopy to confirm complete healing \u2014 an ulcer that fails to heal on repeat endoscopy despite adequate acid suppression should be re-biopsied and regarded as malignant until proven otherwise." }),
                React.createElement(Ref, null, "Glasgow-Blatchford and Rockall scores; standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-3b", title: "Peptic Ulcer Disease \u2014 Medical Therapy Detail & the Refractory Ulcer", icon: "\uD83D\uDC8A", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Irreversibly inhibit the H+/K+-ATPase ('proton pump') on the gastric parietal cell, the final common step of acid secretion regardless of what stimulated it (histamine, gastrin, or vagal/acetylcholine input)."),
                React.createElement(H, { color: "#0ea5e9" }, "Acid Suppression"),
                React.createElement(Row, { c: "#0ea5e9", label: "Proton pump inhibitors (PPIs)", val: "This is why PPIs achieve more complete and reliable acid suppression than the older H2-receptor antagonists, which block only the histamine-mediated pathway and leave gastrin- and vagally-driven secretion relatively intact." }),
                React.createElement(Row, { c: "#0ea5e9", label: "H2-receptor antagonists", val: "Now used less often than PPIs given their less complete acid suppression, though they retain a role where PPI therapy is contraindicated or not tolerated, and are sometimes used for step-down maintenance therapy once an ulcer has healed." }),
                React.createElement(H, { color: "#0ea5e9" }, "H. pylori Eradication Regimens"),
                React.createElement(Row, { c: "#0ea5e9", label: "Standard triple therapy", val: "A PPI combined with two antibiotics (typically amoxicillin and clarithromycin, or metronidazole substituted for amoxicillin in penicillin allergy) for a defined course, generally 7\u201314 days \u2014 rising clarithromycin resistance in some populations has reduced first-line eradication success rates with this regimen, prompting increasing use of quadruple therapy in areas of higher resistance." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Quadruple therapy", val: "Adds bismuth to a PPI and two antibiotics (or uses a non-bismuth 'concomitant' four-drug combination), used either as first-line therapy in areas of known high clarithromycin resistance or as second-line rescue therapy after a failed initial eradication attempt." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Confirming eradication", val: "A urea breath test or stool antigen test, performed at least four weeks after completing antibiotic therapy and after stopping PPI therapy for one to two weeks beforehand (both antibiotics and PPIs can suppress H. pylori enough to produce a false-negative test without truly eradicating it), confirms successful eradication \u2014 serology (antibody testing) is not used to confirm cure, since antibodies typically remain positive for months to years after successful eradication and would incorrectly suggest ongoing infection." }),
                React.createElement(H, { color: "#0ea5e9" }, "The Refractory Ulcer"),
                React.createElement(Row, { c: "#0ea5e9", label: "Working through the differential", val: "An ulcer failing to heal despite apparently adequate therapy should prompt a systematic review: confirming genuine treatment adherence (the single most common reason for apparent 'refractoriness'), confirming H. pylori has actually been eradicated (rather than assumed cured without a confirmatory test), checking for continued covert NSAID or aspirin use (including over-the-counter formulations the patient may not think to mention), reconsidering Zollinger-Ellison syndrome if not already excluded, and re-biopsying the ulcer edge to exclude an underlying malignancy that has been treated as a benign ulcer throughout." }),
                React.createElement(Ref, null, "Standard gastroenterology teaching (Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-4", title: "Gastric Volvulus", icon: "\uD83C\uDF00", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "The stomach rotates around its own long (cardio-pyloric) axis \u2014 the more common type, frequently associated with a large paraesophageal (rolling/type II) hiatus hernia (see Anatomy tab) that allows the stomach to migrate and twist within the chest."),
                React.createElement(Row, { c: "#0ea5e9", label: "Mesenteroaxial volvulus", val: "Rotation around an axis perpendicular to the long axis (roughly gastro-hepatic to gastro-colic) \u2014 less common, and more prone to vascular compromise given the more acute angle of twist relative to the vessels supplying the stomach." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Borchardt's triad", val: "Severe epigastric pain, retching with an inability to vomit, and inability to pass a nasogastric tube \u2014 together strongly suggestive of acute gastric volvulus and an indication for emergency surgical detorsion and gastropexy (or repair of the underlying diaphragmatic defect) before ischaemia and perforation supervene." }),
                React.createElement(Warn, { title: "Do not delay" }, "Borchardt's triad in a patient with a known large hiatus hernia should prompt urgent surgical referral rather than repeated attempts at nasogastric decompression, since the inability to pass the tube is itself part of the diagnostic picture, not simply a technical failure to persist with."),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-5", title: "Gastric Perforation", icon: "\uD83D\uDCA5", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Peptic ulcer disease, covered above, remains by far the most common cause of gastric (and duodenal) perforation; malignant ulcers, ingested foreign bodies, and, rarely, corrosive injury are less common alternative."),
                React.createElement(Row, { label: "Most common cause", val: "Causes that should be considered particularly when the perforation site or surrounding tissue looks atypical at surgery." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Presentation and initial management", val: "Sudden severe epigastric pain rapidly becoming generalised, a rigid ('board-like') abdomen, and systemic signs of sepsis as peritonitis develops \u2014 resuscitation with IV fluids, broad-spectrum antibiotics, and analgesia proceed in parallel with urgent surgical assessment, and an erect chest X-ray or CT confirming free air supports but is not mandatory before proceeding to laparotomy/laparoscopy in a clinically clear case of perforation." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Intraoperative principle", val: "At surgery, the perforation is repaired (typically with an omental patch) and a biopsy of the ulcer edge is taken specifically to exclude malignancy, since a perforated malignant gastric ulcer changes both the immediate operative decision-making and the entire subsequent oncological management pathway." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-5b", title: "Volvulus & Perforation \u2014 Imaging, Differentials & the Boerhaave Distinction", icon: "\uD83D\uDD2C", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "CT is now generally preferred over barium studies for confirming gastric volvulus in the acute setting, since it is faster to obtain in an unwell patient and can simultaneously assess for complications \u2014 a 'whirl sign'."),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83C\uDF00" }, "Imaging Clarification for Volvulus"),
                React.createElement(Row, { c: "#0ea5e9", label: "CT signs", val: "From twisted mesenteric vessels and an abnormally oriented, often markedly distended stomach with the greater curvature lying superior to the lesser curvature (in organoaxial volvulus) or a transposed antrum and fundus (in mesenteroaxial volvulus) are the key distinguishing radiological features between the two subtypes described on the main Gastric Volvulus card." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83E\uDE79" }, "Cameron Lesions \u2014 a Related but Distinct Entity"),
                React.createElement(Row, { c: "#0ea5e9", label: "Mechanism and relevance", val: "Linear erosions or ulcers occurring at the diaphragmatic hiatus in a patient with a large hiatus hernia, caused by mechanical trauma and localised ischaemia as the herniated stomach repeatedly moves across the diaphragmatic pinch point with respiration \u2014 a recognised, sometimes overlooked cause of chronic occult or overt GI bleeding and iron deficiency anaemia in patients with a large hiatus hernia, distinct from the acute, mechanical volvulus/perforation emergencies covered on the main cards but arising from the same underlying anatomical substrate (a large hiatus hernia, see the Anatomy tab)." }),
                React.createElement(SubHead, { color: "#ff4d6d", icon: "\u2696\uFE0F" }, "Boerhaave Syndrome \u2014 the Critical Perforation Differential"),
                React.createElement(Table, { color: "#ff4d6d", headers: ["Feature", "Gastric Perforation", "Boerhaave Syndrome"], rows: [
                        ["What ruptures", "Stomach wall — overwhelmingly due to peptic ulcer disease eroding through the gastric wall", "Full-thickness rupture of the oesophagus itself (not the stomach), classically at the left posterolateral distal oesophagus"],
                        ["Mechanism", "Ulcer erosion through the wall", "Sudden rise in intraoesophageal pressure against a closed glottis — most classically during forceful vomiting"],
                        ["Presentation", "Board-like abdomen, sudden severe abdominal pain", "Severe chest/epigastric pain following a vomiting episode, sometimes with subcutaneous emphysema in the neck (Mackler's triad: vomiting, chest pain, subcutaneous emphysema — full triad present in only a minority); frequently misdiagnosed initially as a cardiac event, pancreatitis, or simple gastric perforation"],
                        ["Why the distinction changes management", "Managed with a laparotomy/laparoscopy and abdominal source control (typically an omental patch)", "Requires thoracic surgical input and mediastinal/pleural source control — mediastinal contamination is tolerated far less well than intraperitoneal contamination, and Boerhaave carries disproportionately high mortality if this diagnostic delay isn't caught"],
                    ] }),
                React.createElement(Warn, { title: "Why the distinction changes management" }, "Mistaking one for the other, or simply assuming any 'perforation' after vomiting is gastric, sends the patient to the wrong operative approach and delays the mediastinal washout that outcome in Boerhaave syndrome specifically depends on."),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-5c", title: "Paraesophageal Hernia \u2014 Elective Repair vs Watchful Waiting", icon: "\u2696\uFE0F", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Earlier surgical teaching held that any large (type II\u2013IV) paraesophageal hiatus hernia should be electively repaired once diagnosed, regardless of symptoms, on the reasoning that the risk of a future acute, potentially."),
                React.createElement(Row, { label: "The historical position", val: "Catastrophic volvulus/incarceration event (see the main Gastric Volvulus card) justified prophylactic surgery even in asymptomatic patients." }),
                React.createElement(Row, { c: "#0ea5e9", label: "The more nuanced current approach", val: "Longer-term outcome data has shown that the annual risk of a genuine emergency presentation in an asymptomatic paraesophageal hernia is lower than previously assumed, and elective repair itself carries meaningful morbidity, particularly in older, frailer patients who are also the group most likely to have such a hernia in the first place \u2014 current practice increasingly favours a more individualised approach, offering elective repair to symptomatic patients (reflux, dysphagia, early satiety, anaemia from Cameron lesions) or those with genuinely high-risk anatomical features, while accepting a watchful-waiting approach in truly asymptomatic, higher-surgical-risk patients rather than automatically operating on every large hiatus hernia found incidentally." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Recurrence after gastropexy/hernia repair", val: "Recurrent herniation is a recognised long-term issue after paraesophageal hernia repair, particularly with primary suture repair of a large hiatal defect alone \u2014 mesh reinforcement of the hiatal repair is used in some cases to reduce this recurrence risk, balanced against a small additional risk of mesh-related complications (erosion, dysphagia) that must be weighed against the benefit in each individual patient." }),
                React.createElement(Tip, null, "This shift from routine prophylactic repair toward a more individualised, symptom- and risk-based approach mirrors a broader pattern seen elsewhere in surgery (for example in asymptomatic gallstones or small AAAs) \u2014 a genuine, evolving move away from 'fix everything found' toward weighing the real event rate against the real cost of intervening on everyone."),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-6", title: "Gastric Adenocarcinoma", icon: "\uD83C\uDF97\uFE0F", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "H. pylori infection (via chronic atrophic gastritis and intestinal metaplasia, the gastric equivalent of the Barrett's sequence above), a diet high in smoked/salted/nitrate-preserved food and low in fresh."),
                React.createElement(Row, { label: "Risk factors", val: "Fruit/vegetables, blood group A, pernicious anaemia (itself producing atrophic gastritis independent of H. pylori), smoking, and hereditary diffuse gastric cancer syndrome (CDH1/E-cadherin germline mutation, warranting consideration of prophylactic gastrectomy in confirmed carriers)." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Staging", val: "TNM 8th edition staging combines depth of gastric wall invasion, regional nodal involvement, and distant metastasis, with staging laparoscopy specifically added before definitive surgery to detect small-volume peritoneal metastases (as for GOJ tumours above) that cross-sectional imaging can miss." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83D\uDD2C" }, "Lauren Classification"),
                React.createElement(Table, { color: "#0ea5e9", headers: ["Feature", "Intestinal type", "Diffuse type"], rows: [
                        ["Histology", "Gland-like structures", "Poorly cohesive signet-ring cells infiltrating the gastric wall without forming discrete glands, reflecting loss of E-cadherin cell-adhesion function — the same gene mutated in hereditary diffuse gastric cancer"],
                        ["Pathway", "Arises via the atrophic gastritis–intestinal metaplasia–dysplasia sequence, paralleling Barrett's disease biologically, just in the stomach rather than the esophagus", "Not sequence-driven in the same way — infiltrative growth from the outset"],
                        ["Typical location & pattern", "More often distal", "Produces the diffusely thickened, non-distensible 'linitis plastica' stomach in advanced cases"],
                        ["Spread & patient profile", "Spreads more haematogenously; generally a somewhat better prognosis", "Tends to affect younger patients; spreads more by direct/transmural and peritoneal routes"],
                        ["Prognosis", "Comparatively better", "Generally worse, given the infiltrative growth pattern makes clear resection margins harder to achieve"],
                    ] }),
                React.createElement(Row, { c: "#0ea5e9", label: "Surgical management", val: "Subtotal (distal) gastrectomy for tumours confined to the distal stomach with adequate proximal margin achievable, versus total gastrectomy for proximal or diffusely infiltrating (linitis plastica) tumours, combined with regional lymphadenectomy \u2014 the extent of lymph node dissection (D1 versus the more extensive D2) has been a long-running area of surgical debate, with D2 dissection by experienced surgeons now generally preferred in fit patients given the staging information and, in some analyses, survival benefit it provides." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Perioperative and palliative therapy", val: "Perioperative chemotherapy (before and after surgery) improves outcomes in resectable disease compared with surgery alone; palliative chemotherapy, and, in HER2-positive tumours specifically, trastuzumab-based regimens (the same HER2-targeted principle covered for breast cancer) extend survival in metastatic disease; palliative stenting or bypass surgery relieves obstruction where cure is not possible." }),
                React.createElement(Ref, null, "Lauren classification; TNM 8th edition; standard surgical/oncology teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-7", title: "Gastrointestinal Stromal Tumour (GIST)", icon: "\uD83E\uDDEB", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Arises from the interstitial cells of Cajal, the GI tract's pacemaker cells responsible for coordinating peristalsis, most commonly in the stomach."),
                React.createElement(Row, { label: "Origin", val: "(though it can arise anywhere along the GI tract, the small bowel being the second most common site, covered on the Small Bowel & IBD tab)." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Molecular driver", val: "An activating KIT mutation drives the majority of cases, with a smaller proportion driven by PDGFRA mutation instead \u2014 both converge on constitutive tyrosine kinase activation promoting uncontrolled proliferation, and this shared final pathway is exactly what makes both mutation types susceptible to the same targeted drug." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Risk stratification", val: "Behaviour ranges from indolent to frankly malignant, correlating with tumour size, mitotic rate, and anatomical site (gastric GISTs behave somewhat less aggressively size-for-size than small bowel GISTs) rather than a simple benign/malignant histological binary as seen in most other tumour types." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Management", val: "Surgical resection with clear margins (formal lymphadenectomy is not routinely required, since GISTs rarely spread via lymphatics) is the mainstay for localised disease; imatinib, a tyrosine kinase inhibitor targeting the KIT/PDGFRA pathway, is used as adjuvant therapy in higher-risk resected disease and as primary therapy in unresectable or metastatic GIST \u2014 one of the clearest examples in GI surgical oncology of a genuinely targeted, mutation-specific systemic therapy, and a useful contrast against gastric adenocarcinoma's more traditional chemotherapy-based approach." }),
                React.createElement(Ref, null, "Standard surgical/oncology teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-8", title: "Gastric (MALT) Lymphoma", icon: "\uD83E\uDDA0", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Chronic H. pylori infection drives sustained lymphoid proliferation within gastric mucosa-associated lymphoid tissue."),
                React.createElement(Row, { label: "H. pylori association", val: "(tissue that is not normally present in significant quantity in the healthy stomach, but is acquired in response to chronic H. pylori-driven inflammation), which can progress to a low-grade B-cell (MALT) lymphoma." }),
                React.createElement(Row, { c: "#0ea5e9", label: "The most distinctive management feature", val: "Eradicating the underlying H. pylori infection alone induces regression in a substantial proportion of early-stage, localised MALT lymphomas \u2014 making anti-H. pylori antibiotic therapy legitimate first-line treatment rather than surgery, chemotherapy, or radiotherapy, a genuinely unusual situation in oncology where treating an infection is primary cancer treatment." }),
                React.createElement(Row, { c: "#0ea5e9", label: "When further treatment is needed", val: "Persistent disease after eradication therapy, more advanced-stage disease, or transformation to high-grade (diffuse large B-cell) lymphoma requires escalation to radiotherapy or systemic chemotherapy following the same principles as lymphoma management elsewhere in the body." }),
                React.createElement(Ref, null, "Standard surgical/oncology teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-8b", title: "Gastric Cancer Screening & Early Gastric Cancer", icon: "\uD83D\uDD0E", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Japan and South Korea run population-level endoscopic gastric cancer screening programmes, reflecting the substantially higher background incidence of gastric cancer in these populations compared with most Western."),
                React.createElement(Row, { label: "Why screening exists in some countries and not others", val: "Countries \u2014 the cost-effectiveness of population screening depends heavily on baseline disease incidence, which is precisely why equivalent programmes are not generally run in lower-incidence Western populations despite gastric cancer being far from rare there." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Early gastric cancer (EGC) \u2014 a specific, favourable-prognosis category", val: "Defined as invasive adenocarcinoma confined to the mucosa or submucosa, regardless of lymph node status \u2014 this depth-based definition (rather than a size-based one) exists because depth of invasion is what most reliably predicts nodal metastasis risk in gastric cancer, and EGC by this definition carries a dramatically better prognosis than more deeply invasive disease of an equivalent overall stage." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Endoscopic submucosal dissection (ESD)", val: "An advanced endoscopic technique that resects early gastric cancer en bloc directly from the mucosal/submucosal plane without any external incision, appropriate for carefully selected EGC meeting defined size, differentiation, and ulceration criteria that predict a very low risk of nodal involvement \u2014 where these criteria are met, ESD can be genuinely curative while avoiding the morbidity of formal gastrectomy entirely, a striking contrast with the major surgical resection required for more advanced disease covered on the main Gastric Adenocarcinoma card." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Why this matters even outside high-screening-incidence countries", val: "The concept and criteria for early gastric cancer and endoscopic resection are directly applicable anywhere a gastric cancer happens to be detected at an early stage \u2014 whether through a population screening programme, incidental endoscopy for unrelated dyspepsia, or surveillance in a high-risk individual (e.g. known atrophic gastritis or pernicious anaemia) \u2014 meaning the practical relevance of this category extends well beyond the specific countries that run formal population screening for it." }),
                React.createElement(Ref, null, "Standard surgical/oncology teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-8c", title: "Benign Gastric & Duodenal Tumors", icon: "\uD83D\uDFE2", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "The most common gastric polyp type overall, arising from oxyntic (acid-secreting) mucosa in the fundus/body \u2014 strongly associated with long-term proton pump inhibitor use."),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83E\uDEE7" }, "Gastric Polyps"),
                React.createElement(Table, { color: "#0ea5e9", headers: ["Polyp type", "Key features"], rows: [
                        ["Fundic gland polyps — most common gastric polyp type overall", "Arise from oxyntic (acid-secreting) mucosa in the fundus/body — strongly associated with long-term PPI use (thought to relate to sustained hypergastrinaemia); in a distinct and important minority, associated with familial adenomatous polyposis, where they can be numerous and, unusually for this polyp type, carry genuine dysplasia/malignancy risk in the FAP setting. Sporadic fundic gland polyps carry essentially negligible malignant potential"],
                        ["Hyperplastic polyps", "Arise as a reactive, regenerative response to chronic mucosal injury, most commonly chronic H. pylori gastritis — eradicating the infection can cause these to regress or resolve entirely (mirroring the same logic seen with gastric MALT lymphoma). Larger polyps (generally over 1cm) still warrant removal given a small but real risk of harbouring dysplasia"],
                        ["Gastric adenomatous polyps", "Genuinely premalignant, following essentially the same adenoma-to-carcinoma logic as colonic adenomas — risk of malignant transformation correlates with polyp size and degree of dysplasia, so these are removed endoscopically when found, with surveillance thereafter given the field-change risk of further polyps developing elsewhere"],
                    ] }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83E\uDDEC" }, "Duodenal Tumors"),
                React.createElement(Row, { c: "#0ea5e9", label: "Duodenal adenoma", val: "Most clinically significant in the periampullary region, since these carry malignant potential paralleling colonic adenomas and can progress to periampullary adenocarcinoma (see the Gastric Adenocarcinoma card's note on periampullary duodenal cancer) \u2014 patients with FAP develop duodenal (particularly periampullary) polyposis with near-universal certainty given long enough follow-up, making upper GI endoscopic surveillance a standard, lifelong part of FAP management alongside the colonic surveillance/prophylactic colectomy already covered in the Large Intestine material." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Brunner gland hamartoma", val: "A rare, benign submucosal nodule arising from hyperplasia of Brunner's glands (mucus-secreting glands specific to the duodenal bulb, whose normal function is to protect the duodenal mucosa from gastric acid entering from the stomach) \u2014 usually asymptomatic and found incidentally, though larger lesions can rarely cause obstruction or bleeding; endoscopic or surgical removal is reserved for symptomatic lesions rather than performed routinely for an incidental small finding." }),
                React.createElement(Tip, null, "The organising idea across nearly all of these benign lesions is the same: most gastric and duodenal polyps are reactive/hyperplastic and carry negligible risk on their own, but the same anatomical sites are also where FAP-associated polyposis concentrates outside the colon \u2014 which is precisely why FAP surveillance protocols extend to the upper GI tract rather than stopping at the colon."),
