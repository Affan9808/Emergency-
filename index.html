        appendix: (React.createElement("div", null,
            React.createElement(SectionIntro, { tag: "Inflammation, Tumors & Technique", title: "The Appendix", accent: "#f97316", desc: "A small, blind-ending tube whose entire surgical relevance comes down to one recurring theme \u2014 what happens when its narrow lumen becomes obstructed, and how quickly that obstruction is recognised and relieved." }),
            React.createElement(DiseaseCard, { id: "card-0", title: "Acute Appendicitis \u2014 Pathophysiology & Clinical Signs", icon: "\uD83D\uDD25", color: "#f97316" },
                React.createElement(Box, { color: "#f97316", title: "Overview" }, "Luminal obstruction \u2014 most often a faecolith, but also lymphoid hyperplasia (particularly common in children and young adults following viral illness), or rarely a tumour or parasite."),
                React.createElement(Row, { label: "The obstruction cascade", val: "Traps mucus secretion behind the blockage, progressively distending the appendix; rising intraluminal pressure first compromises venous and lymphatic drainage, then arterial supply, producing ischaemia that allows bacterial translocation across the compromised wall, culminating in transmural inflammation, gangrene, and, if untreated, perforation." }),
                React.createElement(Row, { c: "#f97316", label: "The classic visceral-to-somatic pain shift", val: "Pain typically begins as poorly localised, colicky periumbilical discomfort, reflecting visceral afferent innervation of the midgut-derived appendix converging on the same spinal levels as the rest of the midgut \u2014 as inflammation progresses to involve the adjacent parietal peritoneum (which has somatic innervation), pain migrates to and localises sharply over McBurney's point in the right iliac fossa, a shift that is itself one of the most reliable individual features in the history." }),
                React.createElement(Row, { c: "#f97316", label: "Examination signs", val: "Rovsing's sign (palpation of the left iliac fossa producing pain in the right iliac fossa, from peritoneal irritation transmitted across the abdomen), psoas sign (pain on passive hip extension, suggesting a retrocaecal appendix irritating the psoas muscle), and obturator sign (pain on internal rotation of the flexed hip, suggesting a pelvic appendix irritating obturator internus) \u2014 appendix position variants (see the companion file's Anatomy tab) directly explain why these signs are inconsistently present, since they only manifest when the inflamed appendix is anatomically positioned to irritate the corresponding structure." }),
                React.createElement(Row, { c: "#f97316", label: "Why presentation is so variable", val: "None of the classical signs is individually sensitive or specific enough to rule the diagnosis in or out alone \u2014 a retrocaecal appendix may produce only vague flank discomfort with a relatively benign-feeling abdomen, while a pelvic appendix may produce urinary symptoms or diarrhoea from rectal/bladder irritation rather than classical right iliac fossa signs, which is precisely why appendicitis remains one of the more commonly missed or delayed acute abdominal diagnoses despite being conceptually simple." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-1", title: "Acute Appendicitis \u2014 Scoring, Investigation & Management", icon: "\uD83D\uDCCB", color: "#f97316" },
                React.createElement(Box, { color: "#f97316", title: "Overview" }, "Combines clinical features (migratory right iliac fossa pain, anorexia, nausea/vomiting, right iliac fossa tenderness, rebound tenderness, fever) with laboratory findings such as leucocytosis and neutrophilia."),
                React.createElement(Row, { label: "The Alvarado score", val: "(leucocytosis, left shift/neutrophilia) into a single score out of 10, used to stratify pre-test probability and guide the threshold for imaging versus direct surgical referral \u2014 a low score makes appendicitis unlikely and supports observation or alternative diagnosis workup, a high score supports proceeding toward surgery, and an intermediate score typically prompts cross-sectional imaging (ultrasound or CT) to clarify." }),
                React.createElement(Row, { c: "#f97316", label: "Imaging choice", val: "Ultrasound is often first line, particularly in children and women of reproductive age (avoiding radiation and helping exclude gynaecological differentials such as ovarian torsion or a ruptured ovarian cyst), though its sensitivity is operator-dependent and reduced in obese patients; CT has higher sensitivity and specificity overall and is often preferred in adults, particularly where the diagnosis remains uncertain after clinical assessment and ultrasound." }),
                React.createElement(Row, { c: "#f97316", label: "Differential diagnosis", val: "Mesenteric adenitis (particularly in children, often following a preceding viral illness, generally managed conservatively without surgery), gynaecological causes (ovarian torsion, ruptured ovarian cyst, ectopic pregnancy \u2014 a pregnancy test is mandatory in any woman of reproductive age with right iliac fossa pain), Meckel's diverticulitis (clinically indistinguishable from appendicitis preoperatively in most cases), and right-sided diverticulitis (more common in some Asian populations, see the companion file's diverticular disease card) all sit on the differential and partly explain why a proportion of appendectomies historically found a normal appendix at surgery." }),
                React.createElement(Row, { c: "#f97316", label: "Management", val: "Appendectomy remains standard management for confirmed acute appendicitis, though a growing evidence base supports antibiotic-only management as a reasonable alternative in selected, uncomplicated (non-perforated, no faecolith) cases who wish to avoid surgery, accepting a meaningful risk of recurrence requiring delayed appendectomy \u2014 this represents a genuine shift in an area of surgery long regarded as having only one correct answer." }),
                React.createElement(H, { color: "#f97316" }, "Chronic/Recurrent Appendicitis"),
                React.createElement(Row, { c: "#f97316", label: "A genuinely debated entity", val: "Some patients experience recurrent episodes of right iliac fossa pain with incomplete resolution between attacks, thought to represent low-grade, partially obstructing, recurrent inflammation rather than a single acute event \u2014 the entity remains less clearly defined than classical acute appendicitis, and interval appendectomy is sometimes offered once other causes of recurrent right iliac fossa pain (gynaecological, urological, and the differentials above) have been reasonably excluded." }),
                React.createElement(Ref, null, "Alvarado score; standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-1b", title: "Appendicitis \u2014 Diagnostic Pitfalls in Specific Patient Groups", icon: "\u26A0\uFE0F", color: "#f97316" },
                React.createElement(Box, { color: "#f97316", title: "Overview" }, "Patients on long-term corticosteroids, other immunosuppressants, or with HIV/immunodeficiency can mount a markedly reduced inflammatory response \u2014 reduced or absent fever, a less pronounced leucocytosis, and less."),
                React.createElement(H, { color: "#f97316" }, "Immunosuppressed and Diabetic Patients"),
                React.createElement(Row, { c: "#f97316", label: "Blunted presentation in immunosuppression", val: "Obvious peritonism on examination despite potentially advanced underlying pathology \u2014 meaning clinical severity is easily underestimated and a lower threshold for imaging and surgical review is appropriate in this group compared with an immunocompetent patient with an identical-looking clinical picture." }),
                React.createElement(Row, { c: "#f97316", label: "Diabetic patients and diabetic ketoacidosis as a bidirectional trap", val: "Diabetic ketoacidosis itself commonly produces abdominal pain, tenderness, and even a mild leucocytosis mimicking a surgical abdomen, which can lead to unnecessary surgical referral or delay in treating the metabolic derangement itself; conversely, a genuine intra-abdominal surgical cause (including appendicitis) can precipitate DKA in a diabetic patient, so the presence of ketoacidosis does not exclude a true surgical abdomen underlying it \u2014 resolution of abdominal pain with correction of the ketoacidosis and metabolic derangement supports a purely metabolic cause, while persistent pain despite adequate DKA treatment should prompt renewed surgical assessment." }),
                React.createElement(H, { color: "#f97316" }, "Broadening the Differential \u2014 Right Iliac Fossa Pain Mimics"),
                React.createElement(List, { c: "#f97316", items: [
                        "Gynaecological: ovarian torsion, ruptured ovarian cyst, ectopic pregnancy, pelvic inflammatory disease — a pregnancy test and consideration of pelvic ultrasound are essentially mandatory in any woman of reproductive age with right iliac fossa pain.",
                        "Urological: ureteric colic (right-sided renal/ureteric stone) and, in males, testicular torsion presenting with referred lower abdominal pain before the testicular pain itself becomes prominent — a testicular examination is an easily-skipped but important part of assessing right iliac fossa pain in a male patient.",
                        "Other GI causes: Meckel's diverticulitis (clinically indistinguishable from appendicitis preoperatively in the great majority of cases, see the companion Anatomy tab), right-sided diverticulitis (see the companion Colon tab), and mesenteric adenitis (particularly in children, generally self-limiting and managed conservatively).",
                        "Rarer mimics: right-sided pyelonephritis, terminal ileal Crohn's disease presenting acutely, and, in the right clinical context, a psoas abscess.",
                    ] }),
                React.createElement(Tip, null, "The breadth of this differential is exactly why a normal-appearing appendix is still occasionally found at surgery for presumed appendicitis \u2014 accepting a reasonable rate of 'negative' exploration in genuinely equivocal cases is a deliberate trade-off against the greater harm of missing or delaying treatment of true appendicitis, rather than a sign that the diagnostic process itself has failed."),

                React.createElement(Box, { color: "#f97316", title: "Overview" }, "The most common tumour of the appendix overall, frequently discovered incidentally in a specimen removed for presumed simple appendicitis, since small carcinoids rarely produce their own symptoms and are instead found."),
                React.createElement(Row, { label: "Frequency and typical discovery", val: "On routine histological examination of an otherwise unremarkable-looking appendectomy specimen." }),
                React.createElement(Row, { c: "#f97316", label: "Size-based management", val: "A tumour under roughly 1 cm confined to the appendix is adequately treated by simple appendectomy alone, given the very low risk of nodal involvement at this size; a tumour over roughly 2 cm, or one with high-risk features (mesoappendiceal invasion beyond a few millimetres, involvement of the appendiceal base, higher grade/mitotic count, lymphovascular invasion), warrants completion right hemicolectomy given the greater risk of regional lymph node involvement; tumours in the 1\u20132 cm range are judged on these additional risk features rather than size alone." }),
                React.createElement(Row, { c: "#f97316", label: "Why the appendiceal base matters specifically", val: "A carcinoid involving the base of the appendix is treated more aggressively even at a smaller size than one confined to the tip, since base involvement raises the possibility of tumour cells having already accessed the richer lymphatic drainage nearer the caecum, whereas a tip lesion has a longer lymphatic path to travel before reaching regional nodes." }),

                React.createElement(Box, { color: "#f97316", title: "Overview" }, "Less common than carcinoid but behaves more aggressively, often presenting with (or mimicking) acute appendicitis due to luminal obstruction by the tumour itself."),
                React.createElement(Row, { label: "Adenocarcinoma", val: "Typically requires formal right hemicolectomy given its higher metastatic potential compared with a small, low-risk carcinoid, following essentially the same oncological principles as caecal adenocarcinoma given their shared embryological origin and lymphatic drainage." }),
                React.createElement(Row, { c: "#f97316", label: "Mucinous cystadenoma \u2014 the benign end of the spectrum", val: "A genuinely benign mucin-producing lesion in which the epithelial lining shows no dysplasia \u2014 distinct from, and with a materially better prognosis than, the low-grade appendiceal mucinous neoplasm (LAMN) and mucinous adenocarcinoma described below, though the distinction between a mucinous cystadenoma and a LAMN can only be made histologically after removal, not on imaging or gross appearance alone, which is exactly why any mucin-filled appendix (a 'mucocele', regardless of presumed benignity) is handled with the same intraoperative caution described in the warning below." }),

                React.createElement(Warn, { title: "Handle appendiceal masses with caution" }, "An appendiceal mass found unexpectedly to be firm, irregular, or associated with mucin at surgery should raise suspicion for an underlying mucinous or malignant tumour, and prompts caution against simple appendectomy alone without oncological consideration, given the risk of iatrogenically seeding pseudomyxoma peritonei if a mucinous tumour is ruptured during what was intended as a routine appendectomy."),
                React.createElement(Ref, null, "Standard surgical/oncology teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-3b", title: "Goblet Cell Adenocarcinoma & Staging Nuances", icon: "\uD83E\uDDEB", color: "#f97316" },
                React.createElement(Box, { color: "#f97316", title: "Overview" }, "A distinct, hybrid appendiceal tumour showing both neuroendocrine (goblet cell) and glandular adenocarcinomatous differentiation \u2014 behaves more aggressively than a pure carcinoid but is generally still less aggressive."),
                React.createElement(Row, { label: "Goblet cell adenocarcinoma (adenocarcinoma ex-goblet cell carcinoid)", val: "Than conventional appendiceal adenocarcinoma, occupying a genuine intermediate position between the two entities covered on the earlier cards rather than fitting cleanly into either category." }),

                React.createElement(Row, { label: "Open vs laparoscopic", val: "Alongside the diagnostic advantage of allowing full visual assessment of the pelvis and other abdominal organs when the diagnosis is uncertain preoperatively (particularly valuable in women of reproductive age, given the gynaecological differentials covered earlier on this tab)." }),
                React.createElement(Row, { c: "#f97316", label: "When open surgery remains appropriate", val: "Open appendectomy (via a McBurney's or Lanz incision) remains appropriate where laparoscopy is unavailable, in cases of diffuse peritonitis with dense adhesions making laparoscopic dissection unsafe, or where laparoscopic access is otherwise technically unsafe (e.g. multiple previous abdominal surgeries with extensive adhesions)." }),
                React.createElement(Row, { c: "#f97316", label: "Complications", val: "Wound infection (the most common complication, particularly following perforated or gangrenous appendicitis with a higher bacterial load at the time of surgery), intra-abdominal/pelvic abscess formation (from residual contamination, sometimes presenting days after apparently successful surgery with fever and localised pain, often requiring percutaneous drainage), and, rarely, 'stump appendicitis' \u2014 recurrent inflammation of a retained appendiceal stump left too long at the original operation, a genuine though uncommon cause of recurrent right iliac fossa pain after a documented previous appendectomy that is easily overlooked given how counterintuitive it seems after the appendix has supposedly already been removed." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-4c", title: "Appendectomy \u2014 Operative Steps", icon: "\uD83E\uDE79", color: "#f97316" },
                React.createElement(Box, { color: "#f97316", title: "Overview" }, "The sequential technical steps of removing the appendix, by either the open or laparoscopic approach, and the key operative decisions at each stage."),
                React.createElement(SubHead, { c: "#f97316", icon: "\uD83D\uDD2A" }, "Open Appendectomy"),
                React.createElement(PillarCard, { n: 1, total: 6, color: "#f97316", title: "Incision", body: "A muscle-splitting (gridiron/McBurney's, or the more transverse Lanz) incision is made centred over McBurney's point, splitting rather than cutting external oblique, internal oblique, and transversus abdominis along their fibres to reach the peritoneum, minimising damage to the abdominal wall's structural integrity compared with a formal cutting incision." }),
                React.createElement(PillarCard, { n: 2, total: 6, color: "#f97316", title: "Identify the appendix", body: "The peritoneum is opened and the caecum identified, then delivered into the wound \u2014 the appendix is located by following the taeniae coli of the caecum down to their confluence at the appendiceal base, a reliable landmark regardless of where the appendiceal tip itself lies (see the Anatomy tab's discussion of position variants)." }),
                React.createElement(PillarCard, { n: 3, total: 6, color: "#f97316", title: "Secure the mesoappendix", body: "The mesoappendix, carrying the appendicular artery, is clamped, divided, and ligated first, securing the blood supply before the appendix itself is handled further." }),
                React.createElement(PillarCard, { n: 4, total: 6, color: "#f97316", title: "Divide the base", body: "The appendiceal base is crushed, ligated, and divided, with the stump either simply ligated or additionally invaginated (buried) into the caecal wall depending on surgeon preference and local practice, since evidence does not strongly favour one over the other for reducing stump-related complications." }),
                React.createElement(PillarCard, { n: 5, total: 6, color: "#f97316", title: "Send specimen for histology", body: "The specimen is sent for histology in every case, specifically to identify an unsuspected appendiceal tumour (see the earlier Appendix Tumors cards) that was not apparent on gross inspection." }),
                React.createElement(PillarCard, { n: 6, total: 6, color: "#f97316", title: "Close the wound", body: "The wound is closed in layers, with the skin closure approach sometimes modified (e.g. delayed primary closure) in heavily contaminated, perforated cases to reduce surgical site infection risk (see the general wound care principles covered elsewhere in this curriculum)." }),
                React.createElement(SubHead, { c: "#f97316", icon: "\uD83C\uDFA5" }, "Laparoscopic Appendectomy"),
                React.createElement(PillarCard, { n: 1, total: 5, color: "#f97316", title: "Establish pneumoperitoneum and ports", body: "Pneumoperitoneum is established and typically three ports are placed (umbilical for the camera, plus two working ports, commonly suprapubic and left iliac fossa) allowing full visual assessment of the pelvis and abdomen before committing to the appendix itself \u2014 the diagnostic advantage discussed on the main technique card." }),
                React.createElement(PillarCard, { n: 2, total: 5, color: "#f97316", title: "Identify and mobilise", body: "The appendix and its mesoappendix are identified and mobilised under direct vision." }),
                React.createElement(PillarCard, { n: 3, total: 5, color: "#f97316", title: "Divide the mesoappendix", body: "The mesoappendix is divided using energy devices (bipolar diathermy or an ultrasonic device) or a vascular stapler, sealing the appendicular vessels without needing the same clamp-and-tie sequence used in open surgery." }),
                React.createElement(PillarCard, { n: 4, total: 5, color: "#f97316", title: "Divide the base and extract", body: "The appendiceal base is divided, most commonly with an endoscopic stapler placed across the base (rather than the ligate-and-crush technique of open surgery), though endoloop ligation is a recognised alternative where stapling is unavailable or the base anatomy is unfavourable. The specimen is extracted in a retrieval bag through one of the port sites specifically to avoid direct contact between the (potentially infected/perforated) specimen and the abdominal wall wound, reducing port-site infection risk." }),
                React.createElement(PillarCard, { n: 5, total: 5, color: "#f97316", title: "Close", body: "Pneumoperitoneum is released and ports closed, generally with a faster return to normal activity than the open approach given the smaller wounds involved." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-4b", title: "Appendicitis & Appendectomy in Special Populations", icon: "\uD83D\uDC65", color: "#f97316" },
                React.createElement(Box, { color: "#f97316", title: "Overview" }, "The gravid uterus progressively displaces the appendix superiorly and laterally as pregnancy advances, so pain in later pregnancy may localise to the right upper quadrant or flank rather than the classical right iliac."),
                React.createElement(H, { color: "#f97316" }, "Pregnancy"),
                React.createElement(Row, { c: "#f97316", label: "Why presentation is atypical", val: "Fossa position, and the physiological leucocytosis of normal pregnancy reduces the diagnostic value of a raised white cell count \u2014 together these make appendicitis in pregnancy both easier to miss and, historically, more likely to be operated on unnecessarily (a 'negative appendectomy') when clinicians tried to compensate for diagnostic uncertainty by lowering the threshold to operate." }),
                React.createElement(Row, { c: "#f97316", label: "Imaging choice", val: "Ultrasound is preferred as first-line imaging to avoid ionising radiation to the fetus, with MRI (which also avoids radiation) as the next step when ultrasound is inconclusive \u2014 CT is reserved for situations where the diagnosis remains genuinely unclear and the risk of missing a surgical abdomen is judged to outweigh the radiation exposure, since untreated maternal appendicitis with perforation carries a substantial fetal loss risk that generally outweighs imaging-related concerns when the clinical picture demands an answer." }),
                React.createElement(Row, { c: "#f97316", label: "Management", val: "Laparoscopic appendectomy is now generally considered safe throughout pregnancy in experienced hands, including the third trimester, and is preferred over open surgery for the same recovery and visualisation advantages seen in non-pregnant patients \u2014 delaying surgery for a confirmed diagnosis out of excessive caution around anaesthesia or pregnancy itself is not supported by outcome data and risks the considerably greater harm of progression to perforation." }),
                React.createElement(H, { color: "#f97316" }, "Children"),
                React.createElement(Row, { c: "#f97316", label: "Why perforation rates are higher at presentation", val: "Younger children often cannot localise or describe pain reliably, and non-specific symptoms (irritability, reduced oral intake, vague abdominal discomfort) can delay recognition by both parents and clinicians \u2014 combined with a thinner, less well-developed omentum that is less able to wall off and contain an evolving perforation compared with an adult's more substantial omentum, this means perforation at presentation is considerably more common in young children than in adults." }),
                React.createElement(H, { color: "#f97316" }, "Elderly Patients"),
                React.createElement(Row, { c: "#f97316", label: "Atypical, blunted presentation", val: "Older patients frequently present with less pronounced fever, a less dramatically raised white cell count, and vaguer pain than younger adults, reflecting a blunted systemic inflammatory response \u2014 combined with a higher burden of comorbidity and a lower physiological reserve to tolerate a delayed diagnosis or perforation, this combination of subtler presentation and less reserve is why elderly patients carry a disproportionately higher mortality from appendicitis despite it being, mechanistically, the same disease as in a young fit adult." }),
                React.createElement(H, { color: "#f97316" }, "The Appendix Mass/Phlegmon \u2014 a Distinct Management Fork"),
                React.createElement(Row, { c: "#f97316", label: "Recognition", val: "A minority of patients present late, days into their illness, with a palpable right iliac fossa mass formed by omentum and adjacent bowel walling off the inflamed appendix (a phlegmon) rather than diffuse peritonitis \u2014 attempting immediate appendectomy in this setting is technically difficult and hazardous, since the tissue planes are densely inflamed and adherent, carrying a higher risk of inadvertent bowel injury than in early, unwalled-off appendicitis." }),
                React.createElement(Row, { c: "#f97316", label: "The Ochsner-Sherren (conservative) approach", val: "Initial conservative management with IV antibiotics and, where a discrete collection is present, percutaneous drainage, deferring appendectomy to an 'interval' operation performed some 6\u20138 weeks later once all inflammation has fully settled and the tissue planes have normalised \u2014 this staged approach converts a technically hazardous emergency dissection into a straightforward elective one." }),
                React.createElement(Row, { c: "#f97316", label: "Whether interval appendectomy is still needed", val: "Practice has shifted in some centres toward omitting routine interval appendectomy after successful conservative management of an appendix mass in adults, relying instead on interval colonoscopy/imaging to exclude an underlying caecal tumour presenting as a mass (a genuine differential in older patients) \u2014 recurrence of appendicitis after successful non-operative management is real but relatively low, so the decision to proceed to interval appendectomy versus watchful surveillance is individualised rather than protocol-driven in every case." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love); Ochsner-Sherren regimen.")))),
        /* ═══════════════════ TAB 3 — ANORECTAL ═══════════════════ */
        anorectal: (React.createElement("div", null,
            React.createElement(SectionIntro, { tag: "Dentate Line Down", title: "Anorectal Surgery", accent: "#ef4444", desc: "Every disease on this tab is best understood relative to a single landmark \u2014 the dentate line \u2014 since it is what determines pain sensation, blood supply, and even which cancer subtype can arise on either side of it." }),
            React.createElement(DiseaseCard, { id: "card-0", title: "Hemorrhoids", icon: "\uD83D\uDD34", color: "#ef4444" },
                React.createElement(Box, { color: "#ef4444", title: "Overview" }, "Hemorrhoids are normal vascular cushions of the anal canal that become symptomatic when engorged and prolapsed, most classically at the 3, 7, and 11 o'clock positions in the lithotomy position."),
                React.createElement(Row, { label: "Anatomy", val: "Corresponding to the terminal branches of the superior rectal artery \u2014 internal haemorrhoids arise above the dentate line (visceral innervation, hence classically painless) while external haemorrhoids arise below it (somatic innervation, hence painful, particularly when thrombosed, since a thrombosed external haemorrhoid is a genuinely painful, tender, bluish perianal lump rather than a silent finding)." }),
                React.createElement(SubHead, { c: "#ef4444", icon: "\uD83D\uDCCA" }, "Grading (Internal Haemorrhoids)"),
                React.createElement(Table, { headers: ["Grade", "Features"], rows: [
                        ["Grade I", "Bleed but do not prolapse."],
                        ["Grade II", "Prolapse with straining/defaecation but reduce spontaneously."],
                        ["Grade III", "Prolapse and require manual reduction."],
                        ["Grade IV", "Permanently prolapsed and irreducible."],
                    ] }),
                React.createElement(Row, { c: "#ef4444", label: "Predisposing factors", val: "Chronic straining (from constipation or, less commonly, chronic diarrhoea), pregnancy (raised intra-abdominal pressure and pelvic venous congestion), prolonged sitting/toileting, and ageing (progressive weakening of the supportive connective tissue anchoring the anal cushions in place) \u2014 the shared final pathway across these varied causes is repeated or sustained increased pressure within the anal cushions' vascular supply." }),
                React.createElement(SubHead, { c: "#ef4444", icon: "\uD83E\uDE9C" }, "Management Ladder"),
                React.createElement(PillarCard, { n: 1, total: 4, color: "#ef4444", title: "Dietary/fibre measures", body: "Dietary fibre and adequate fluid intake to soften stool and reduce straining underpin management at every grade." }),
                React.createElement(PillarCard, { n: 2, total: 4, color: "#ef4444", title: "Office-based procedures", body: "Rubber band ligation is effective for grade I\u2013III disease and can typically be performed in an outpatient clinic setting; infrared coagulation and sclerotherapy are lower-morbidity alternatives generally reserved for lower-grade disease." }),
                React.createElement(PillarCard, { n: 3, total: 4, color: "#ef4444", title: "Doppler-guided artery ligation or stapled haemorrhoidopexy", body: "Positioned as a middle-ground option for grade II\u2013IV disease \u2014 stapled haemorrhoidopexy is generally less painful post-operatively, since the staple line sits above the dentate line in the less pain-sensitive visceral zone, but carries a somewhat higher long-term recurrence rate than excisional haemorrhoidectomy." }),
                React.createElement(PillarCard, { n: 4, total: 4, color: "#ef4444", title: "Excisional haemorrhoidectomy", body: "Reserved for grade III\u2013IV disease or where less invasive measures have failed \u2014 traditionally the Milligan-Morgan open technique, more definitively removing the redundant tissue at the cost of a more painful recovery given the wound's location in somatically-innervated tissue below the dentate line." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-0b", title: "Hemorrhoids \u2014 Differential Diagnosis & Special Situations", icon: "\uD83D\uDD0E", color: "#ef4444" },
                React.createElement(Box, { color: "#ef4444", title: "Overview" }, "Presents as a sudden, acutely painful, tender, bluish perianal lump rather than the typically painless bleeding of internal disease \u2014 if the patient presents within roughly 48\u201372 hours of onset."),
                React.createElement(Row, { label: "Thrombosed external haemorrhoid \u2014 a specific management fork", val: "Surgical excision under local anaesthetic gives faster, more definitive pain relief than conservative management; presenting later than this window is generally managed conservatively (analgesia, topical treatment, warm baths, stool softeners) instead, since the acute thrombus has usually already begun to resolve spontaneously by that point and surgery offers comparatively less additional benefit against its own discomfort and recovery time." }),
                React.createElement(Row, { c: "#ef4444", label: "Hemorrhoids in pregnancy", val: "Common given the combination of raised intra-abdominal pressure, pelvic venous congestion, and progesterone-mediated venous wall relaxation \u2014 conservative management (fibre, fluids, topical agents, avoiding straining) is first line throughout pregnancy, with surgical intervention reserved for severe, refractory symptoms, since many pregnancy-related haemorrhoids improve substantially after delivery as the precipitating physiological pressures resolve, making definitive surgery during pregnancy itself rarely justified." }),
                React.createElement(Row, { c: "#ef4444", label: "Distinguishing from rectal prolapse", val: "Prolapsed internal haemorrhoids typically show radial, segmental folds (reflecting the three discrete vascular cushions at 3, 7, and 11 o'clock) rather than the concentric, circumferential mucosal folds seen in a full-thickness rectal prolapse \u2014 this distinction matters since the two conditions have entirely different surgical approaches (haemorrhoidectomy/haemorrhoidopexy versus rectopexy or perineal rectal prolapse repair), and mistaking one for the other leads to the wrong operation being planned." }),
                React.createElement(Row, { c: "#ef4444", label: "Never assume haemorrhoids without adequate examination", val: "Rectal bleeding, particularly in an older patient or with any atypical feature (a fixed, ulcerated, irregular, or non-reducing lesion, unintentional weight loss, or a change in bowel habit alongside the bleeding), should never be attributed to haemorrhoids on symptoms alone without proper examination (including proctoscopy/sigmoidoscopy) and a sufficiently low threshold for further investigation to exclude an anorectal or more proximal colonic malignancy presenting with coincidental or secondary bleeding." }),
                React.createElement(Row, { c: "#ef4444", label: "Post-haemorrhoidectomy complications", val: "Significant postoperative pain (particularly after excisional haemorrhoidectomy, given the somatically-innervated wound below the dentate line), urinary retention (from pelvic floor discomfort and reflex sphincter spasm affecting normal voiding), secondary haemorrhage (typically around day 7\u201310 as the wound slough separates), and, if an excessive circumferential amount of anoderm is removed, anal stenosis \u2014 a recognised long-term complication managed with dilatation or, in severe cases, an anoplasty procedure to reconstruct adequate anal calibre." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-0c", title: "Haemorrhoidal Artery Ligation & the Full Non-Excisional Ladder", icon: "\uD83E\uDE79", color: "#ef4444" },
                React.createElement(Box, { color: "#ef4444", title: "Overview" }, "Uses a Doppler probe built into a specialised proctoscope to directly locate each terminal branch of the superior rectal artery feeding the haemorrhoidal cushions, which is then individually ligated with a suture."),
                React.createElement(Row, { label: "Doppler-guided haemorrhoidal artery ligation (THD)", val: "Reduces arterial inflow to the haemorrhoid without excising any tissue, positioned as a middle-ground option between simple banding and formal excisional haemorrhoidectomy, with less postoperative pain than excision (since no wound is created in the sensitive distal anal canal) but a somewhat higher recurrence rate than excisional surgery for higher-grade disease." }),
                React.createElement(Row, { c: "#ef4444", label: "Infrared coagulation and sclerotherapy", val: "Additional office-based, low-morbidity options alongside rubber band ligation for grade I\u2013II disease \u2014 infrared coagulation uses focused infrared light to coagulate and scar the haemorrhoidal cushion's blood supply, while sclerotherapy injects a sclerosant directly into the haemorrhoid to induce fibrosis; both are generally reserved for lower-grade disease given their more limited effect on more substantially prolapsing haemorrhoids compared with banding or the more definitive options above." }),
                React.createElement(Row, { c: "#ef4444", label: "Positioning the full treatment ladder", val: "From least to most invasive: dietary/fibre measures (all grades) \u2192 office-based procedures (banding, infrared coagulation, sclerotherapy \u2014 grade I\u2013II, sometimes III) \u2192 Doppler-guided artery ligation or stapled haemorrhoidopexy (grade II\u2013IV, less postoperative pain, somewhat higher recurrence) \u2192 excisional haemorrhoidectomy (grade III\u2013IV, most definitive, most painful recovery) \u2014 the overall pattern across this ladder is a broadly consistent trade-off between procedural invasiveness/pain and long-term recurrence risk, which is the central discussion to have explicitly with the patient rather than presenting one technique as simply 'better' than another in isolation." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-1", title: "Anal Fissure", icon: "\u26A1", color: "#ef4444" },
                React.createElement(Box, { color: "#ef4444", title: "Overview" }, "The posterior midline is by far the most common site, reflecting relatively poorer blood supply to this specific point of the anal canal compared with the rest of its circumference."),
                React.createElement(Row, { label: "Location and why", val: "A genuine anatomical watershed at a much smaller scale than the colonic watersheds covered on this chapter's other tab, but the same underlying logic of reduced perfusion predisposing to poor healing applies." }),
                React.createElement(Row, { c: "#ef4444", label: "The self-perpetuating cycle", val: "A tear in the anoderm (often precipitated by passage of a hard stool) triggers reflex spasm of the internal anal sphincter \u2014 this spasm itself further reduces blood flow to the already poorly-perfused posterior midline, impairing healing of the fissure and perpetuating the pain-spasm-ischaemia cycle that turns an acute fissure into a chronic, non-healing one." }),
                React.createElement(Row, { c: "#ef4444", label: "Chronic fissure triad", val: "A chronic fissure classically presents with the fissure itself, a sentinel skin tag ('sentinel pile') at its distal edge (a reactive skin tag formed from chronic oedema and lymphatic congestion), and a hypertrophied anal papilla at its proximal edge \u2014 the presence of this full triad is itself evidence of chronicity rather than a fresh, acute tear, and its presence generally predicts a lower chance of the fissure healing with conservative measures alone." }),
                React.createElement(Row, { c: "#ef4444", label: "Medical management", val: "Topical glyceryl trinitrate (GTN) or diltiazem, both aiming to chemically relax the internal sphincter and break the spasm-ischaemia cycle, are first-line for most fissures (GTN's main limiting side effect is headache from its systemic, as well as local, vasodilatory action, which limits compliance in a meaningful proportion of patients); botulinum toxin injection into the internal sphincter is a second-line option working via the same relaxation principle, with the advantage of a single administration rather than a topical agent requiring consistent daily application." }),
                React.createElement(Row, { c: "#ef4444", label: "Surgical management", val: "Lateral internal sphincterotomy \u2014 surgical division of a portion of the internal sphincter, performed laterally rather than at the fissure site itself to avoid creating a 'keyhole' deformity \u2014 is reserved for fissures refractory to medical therapy, and carries a small but genuine risk of flatus or minor faecal incontinence given the deliberate, if partial and limited, division of the sphincter mechanism, a risk that must be weighed against the near-universal healing rates the procedure achieves." }),
                React.createElement(Warn, { title: "Atypical fissures need further work-up" }, "A fissure that is not in the posterior (or, less commonly, anterior) midline, is multiple, or is unusually painless should prompt consideration of an alternative cause \u2014 Crohn's disease, tuberculosis, HIV-related ulceration, or anal malignancy \u2014 rather than being managed as a routine primary fissure."),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-1b", title: "Anal Fissure \u2014 Differential Diagnosis, Special Populations & Recurrence", icon: "\uD83D\uDC65", color: "#ef4444" },
                React.createElement(Box, { color: "#ef4444", title: "Overview" }, "Usually related to constipation with passage of a hard, large-calibre stool, and managed with dietary/laxative measures to soften stool and break the pain-avoidance cycle."),
                React.createElement(H, { color: "#ef4444" }, "Special Populations"),
                React.createElement(Row, { c: "#ef4444", label: "Fissure in children", val: "(children often withhold defaecation once a fissure makes it painful, which itself worsens subsequent constipation and fissure recurrence) \u2014 surgical sphincterotomy is used only very rarely in children, given the growing sphincter's greater vulnerability to any continence disturbance and the generally excellent response to conservative measures at this age." }),
                React.createElement(Row, { c: "#ef4444", label: "Fissure in Crohn's disease", val: "Often atypical in location (lateral rather than posterior/anterior midline), multiple, deep or undermined in appearance, and \u2014 distinctively \u2014 frequently painless or only mildly painful despite looking clinically severe, unlike the pain out of proportion to appearance typical of a primary fissure; this atypical pain-to-appearance mismatch is itself a useful clinical clue prompting consideration of underlying Crohn's disease rather than a primary fissure." }),
                React.createElement(H, { color: "#ef4444" }, "The Malignant Mimic"),
                React.createElement(Row, { c: "#ef4444", label: "Anal cancer masquerading as a non-healing fissure", val: "A fissure that fails to respond to appropriate medical therapy (adequate trial of topical GTN/diltiazem), particularly if atypically located, indurated, or heaped-up at its edges, should be biopsied to exclude an underlying anal malignancy rather than simply escalated straight to sphincterotomy on the assumption it is simply a treatment-resistant primary fissure." }),
                React.createElement(H, { color: "#ef4444" }, "Recurrence After Sphincterotomy"),
                React.createElement(Row, { c: "#ef4444", label: "Approach to recurrent fissure", val: "Recurrence after an adequately performed lateral internal sphincterotomy should prompt reconsideration of an underlying secondary cause (Crohn's disease, in particular) before assuming simple treatment failure of an otherwise straightforward primary fissure, since repeating or extending sphincterotomy in a patient with undiagnosed Crohn's disease risks compounding continence problems without addressing the actual underlying driver; genuinely recurrent primary fissures unresponsive to a first sphincterotomy may be considered for an advancement flap procedure, which addresses the poor local blood supply directly by bringing in well-vascularised tissue rather than further weakening the sphincter." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-2", title: "Fistula-in-ano \u2014 Origin & Classification", icon: "\uD83D\uDD78\uFE0F", color: "#ef4444" },
                React.createElement(Box, { color: "#ef4444", title: "Overview" }, "The great majority arise from infection of an anal gland at the level of the dentate line."),
                React.createElement(Row, { label: "Cryptoglandular origin", val: "(these glands, embedded in the intersphincteric space, are the anorectal equivalent of the anal crypts becoming a nidus for infection), which tracks to form an abscess and, once it discharges (spontaneously or surgically), leaves behind an epithelialised tract connecting the anal canal to the perianal skin." }),
                React.createElement(Row, { c: "#ef4444", label: "Crohn's disease as a secondary cause", val: "An important secondary cause given Crohn's transmural, fistulising nature (see the companion file's Small Bowel & IBD tab) \u2014 fistulas in this context tend to be more complex, multiple, and higher (more sphincter muscle involved) than typical cryptoglandular fistulas, and often coexist with perianal abscesses and skin tags that make examination and planning more difficult." }),
                React.createElement(Row, { c: "#ef4444", label: "Goodsall's rule", val: "An external opening anterior to a transverse line drawn through the anus tends to track in a straight radial line directly to the anal canal, while an external opening posterior to this line tends to track in a curved course to the posterior midline \u2014 a useful (though imperfect, and less reliable for very anterior or very posterior openings, or in Crohn's-related fistulas) predictor of internal opening location that guides surgical planning before definitive imaging or examination under anaesthesia." }),
                React.createElement(SubHead, { c: "#ef4444", icon: "\uD83D\uDDFA\uFE0F" }, "Parks Classification"),
                React.createElement(Table, { headers: ["Type", "Course"], rows: [
                        ["Intersphincteric", "Tracks between the internal and external sphincter, staying medial to the external sphincter — the most common type and generally the simplest to treat."],
                        ["Transsphincteric", "Crosses through both sphincters."],
                        ["Suprasphincteric", "Tracks up and over the top of the puborectalis before descending to the skin."],
                        ["Extrasphincteric", "Tracks entirely outside the external sphincter complex, often from a pelvic rather than cryptoglandular source, such as diverticular or malignant disease."],
                    ] }),
                React.createElement(Tip, null, "Complexity and the amount of sphincter muscle crossed increase progressively through this list, directly predicting continence risk with simple surgical division."),
                React.createElement(Ref, null, "Goodsall's rule; Parks classification of fistula-in-ano; standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-3", title: "Fistula-in-ano \u2014 Investigation & Management", icon: "\uD83D\uDD27", color: "#ef4444" },
                React.createElement(Box, { color: "#ef4444", title: "Overview" }, "MRI is the imaging modality of choice for complex or recurrent fistulas, mapping the tract's full course, any secondary extensions, and associated collections with far greater accuracy than clinical examination alone."),
                React.createElement(Row, { label: "Investigation", val: "Particularly important before committing to surgery on a complex or Crohn's-related fistula where getting the anatomy wrong risks either missing a septic focus or dividing more sphincter than necessary; endoanal ultrasound is a useful, more immediately available alternative or adjunct in some centres." }),

function App() {
    const [decree, setDecree] = useState("show");      // "show" | "leaving" | "gone" — shown on every open
    const dismissDecree = () => { setDecree("leaving"); setTimeout(() => setDecree("gone"), 600); };
    const last = loadLast();

    const [lastId, setLastId] = useState(last && last.id);
    const open = (id) => { setScreen(id); setLastId(id); saveLast({ id }); };

    /* Android back button / swipe-back returns to the home list instead of closing the app */
    useEffect(() => {

    const homeWithHistory = () => { if (history.state && history.state.m) history.back(); else home(); };

    useEffect(() => { resetScrollTop(); }, [screen]);

    const mod = MODULES.find(m => m.id === screen);
    return React.createElement(React.Fragment, null,
      decree !== "gone" && React.createElement(Decree, { onEnter: decree === "show" ? dismissDecree : () => {}, leaving: decree === "leaving" }),

}
