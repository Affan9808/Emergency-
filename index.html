        /* ═══════════════════ TAB 3 — SMALL BOWEL & IBD ═══════════════════ */
        smallBowel: (React.createElement("div", null,
            React.createElement(SectionIntro, { tag: "From Crohn's to Short Bowel Syndrome", title: "Small Bowel & Inflammatory Disease", accent: "#f59e0b", desc: "This tab covers inflammatory disease, infection, diverticula, obstruction, and the practical surgical output of managing all of them \u2014 stomas, fistulas, and what remains after extensive resection." }),
            React.createElement(DiseaseCard, { id: "card-0", title: "Crohn's Disease \u2014 Deep Dive", icon: "\uD83D\uDD25", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Can affect any part of the GI tract from mouth to anus, characteristically with skip lesions (discontinuous involvement, normal bowel between diseased segments) and transmural inflammation extending through the full."),
                React.createElement(Row, { label: "Distribution and depth of inflammation", val: "Thickness of the bowel wall \u2014 the terminal ileum is the single most commonly affected site, tying back to the Peyer's patch anatomy covered on the Anatomy tab." }),
                React.createElement(Row, { c: "#f59e0b", label: "Why transmural inflammation matters", val: "This full-thickness involvement is precisely why Crohn's \u2014 unlike the mucosa-limited ulcerative colitis \u2014 produces strictures (from chronic transmural fibrosis), fistulas (transmural tracts connecting to adjacent bowel, bladder, vagina, or skin), and abscesses, complications essentially unique to it among the two major IBD subtypes." }),
                React.createElement(Row, { c: "#f59e0b", label: "Montreal/behavioural classification", val: "Disease is classified by age at diagnosis, location (ileal, colonic, ileocolonic, or isolated upper GI), and behaviour \u2014 inflammatory (non-stricturing, non-penetrating), stricturing, or penetrating (fistulising/abscess-forming) \u2014 behaviour classification in particular predicts the likely future need for surgery and guides which complications to specifically monitor for." }),
                React.createElement(Row, { c: "#f59e0b", label: "Extraintestinal manifestations", val: "Erythema nodosum and pyoderma gangrenosum (skin), episcleritis and uveitis (eye), enteropathic arthritis (joints), and, less commonly than in ulcerative colitis, primary sclerosing cholangitis \u2014 some track with intestinal disease activity (erythema nodosum, peripheral arthritis) while axial arthritis runs a course independent of gut disease control." }),
                React.createElement(Row, { c: "#f59e0b", label: "Medical management principles", val: "Induction of remission (corticosteroids, or biologic therapy such as anti-TNF agents for moderate-severe disease) followed by maintenance therapy (immunomodulators such as azathioprine, or continued biologic therapy) \u2014 the overall aim of modern medical management is increasingly to prevent the bowel damage (strictures, fistulas) that drives surgical need, rather than simply treating symptomatic flares as they occur." }),
                React.createElement(Ref, null, "Montreal classification of IBD; NICE NG130; standard gastroenterology teaching (Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-1", title: "Crohn's Disease \u2014 Surgical Indications & Principles", icon: "\uD83D\uDD2A", color: "#f59e0b", compare: true },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Fibrotic stricture causing obstruction unresponsive to medical therapy, enterocutaneous or other internal fistula, abscess formation, and failure of maximal medical therapy to control symptoms or induce remission."),
                React.createElement(Row, { c: "#f59e0b", label: "Why surgery is deliberately conservative", val: "Surgery in Crohn's uses limited, bowel-sparing resection (removing only clearly diseased, symptomatic segments with minimal additional margin) or stricturoplasty (widening a stricture without resecting bowel length at all) rather than the wide, generous resection margins used in colorectal cancer surgery \u2014 this conservatism exists specifically because Crohn's frequently recurs at or near a surgical anastomosis regardless of how much margin was taken, so repeated resections over a patient's lifetime risk cumulative short bowel syndrome (covered later on this tab), making preserving bowel length itself an active surgical priority rather than a secondary consideration." }),
                React.createElement(Row, { c: "#f59e0b", label: "Contrast with ulcerative colitis", val: "Removing the colon and rectum cures ulcerative colitis outright, since UC is a mucosal disease limited to a single organ; no resection reliably cures Crohn's disease, since it can recur anywhere along the remaining GI tract \u2014 this single fact is the most efficient way to distinguish the two conditions' surgical philosophy, and explains why UC surgery aims for definitive cure (total proctocolectomy) while Crohn's surgery aims for symptom/complication control while preserving as much bowel as possible." }),
                React.createElement(Tip, null, "When a question describes recurrent disease at a surgical anastomosis some years after bowel resection for IBD, this is a strong pointer toward Crohn's disease rather than ulcerative colitis \u2014 recurrence at the anastomosis is essentially expected in Crohn's over a long enough follow-up, and would be unusual (and diagnostically reconsidered) in a patient whose entire colon and rectum were already removed for UC."),
                React.createElement(Ref, null, "Standard surgical/gastroenterology teaching (Bailey & Love; Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-1b", title: "Crohn's Disease \u2014 Medical Therapy in Detail", icon: "\uD83D\uDC8A", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Aminosalicylates (e.g. mesalazine), the mainstay of mild-moderate ulcerative colitis, have only weak and inconsistent evidence for benefit in Crohn's disease \u2014 a genuinely important contrast with UC management."),
                React.createElement(Row, { label: "5-ASA agents \u2014 a limited role", val: "And a reminder that the two conditions, despite both being called 'inflammatory bowel disease', are not interchangeable in their response to the same drug classes." }),
                React.createElement(Row, { c: "#f59e0b", label: "Corticosteroids \u2014 induction, not maintenance", val: "Effective for inducing remission in an acute flare, but not used for long-term maintenance given their substantial cumulative side-effect burden (osteoporosis, adrenal suppression, cushingoid features, impaired wound healing, glucose intolerance) \u2014 a patient repeatedly requiring steroid courses to control symptoms ('steroid-dependent' disease) is a specific trigger to escalate to an immunomodulator or biologic agent rather than simply prescribing another course." }),
                React.createElement(Row, { c: "#f59e0b", label: "Immunomodulators", val: "Azathioprine (or its active metabolite mercaptopurine) and methotrexate are used for maintenance of remission, generally in combination with or following biologic therapy rather than as sole first-line agents in more than mild disease \u2014 thiopurine methyltransferase (TPMT) activity should be checked before starting azathioprine, since patients with low or absent TPMT activity metabolise the drug poorly and are at markedly increased risk of severe, potentially life-threatening myelosuppression at standard doses." }),
                React.createElement(Row, { c: "#f59e0b", label: "Biologic therapy", val: "Anti-TNF agents (infliximab, adalimumab) block a key inflammatory cytokine driving Crohn's disease and are highly effective for inducing and maintaining remission, including closure of some fistulas; anti-integrin therapy (vedolizumab) works by a gut-selective mechanism, blocking lymphocyte trafficking specifically into gut tissue; anti-IL-12/23 therapy (ustekinumab) targets a different inflammatory pathway again \u2014 the availability of multiple mechanistically distinct biologic classes allows switching to a different pathway entirely if a patient loses response to or never responds to their first-line agent." }),
                React.createElement(Warn, { title: "Screening before biologic therapy" }, "Anti-TNF and other biologic agents carry a risk of reactivating latent tuberculosis and other latent infections \u2014 screening (chest X-ray, and an interferon-gamma release assay or tuberculin skin test) for latent TB is mandatory before starting biologic therapy, directly tying back to the differential diagnosis discussion on the Intestinal Tuberculosis card, since missing latent TB before immunosuppression risks converting a quiescent infection into active, disseminated disease."),
                React.createElement(Row, { c: "#f59e0b", label: "'Step-up' vs 'top-down' treatment strategy", val: "The traditional 'step-up' approach starts with milder agents (5-ASA, then steroids, then immunomodulators) and escalates only on treatment failure; the 'top-down' approach starts with early biologic therapy (sometimes combined with an immunomodulator) in patients identified as having poor-prognosis features (young age at diagnosis, extensive disease, perianal or penetrating disease at presentation), on the rationale that earlier, more effective disease control prevents the irreversible bowel damage (strictures, fistulas) that drives surgery \u2014 this represents a genuine, still-evolving shift in philosophy from treating symptoms as they arise toward pre-emptively altering the disease's natural history." }),
                React.createElement(Ref, null, "NICE NG130; standard gastroenterology teaching (Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-2", title: "Intestinal Tuberculosis", icon: "\uD83E\uDDA0", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "The ileocecal region is by far the most commonly affected site, reflecting the relative luminal stasis and abundance of lymphoid tissue (Peyer's patches) there, providing a favourable environment for mycobacterial."),
                React.createElement(Row, { label: "Site and mechanism", val: "Implantation and granulomatous reaction \u2014 infection may be primary (swallowed organisms from pulmonary disease, contaminated milk in areas with unpasteurised dairy and bovine TB) or reactivation of latent disease." }),
                React.createElement(Row, { c: "#f59e0b", label: "Epidemiological context", val: "Remains a significant cause of ileocecal disease in TB-endemic regions and should always be considered in patients with relevant risk factors (immunosuppression including HIV, migration from or travel to endemic areas, close TB contact) presenting with an ileocecal mass, stricture, or malabsorption picture." }),
                React.createElement(Row, { c: "#f59e0b", label: "Why it mimics Crohn's disease so closely", val: "Both produce transmural granulomatous inflammation, strictures, and a similar ileocecal distribution, and both can present with weight loss, abdominal pain, and altered bowel habit \u2014 the caseating necrosis characteristic of tuberculous granulomas (versus the typically non-caseating granulomas of Crohn's) is a key histological discriminator, though the two are notoriously difficult to distinguish on imaging alone, and empirical anti-tuberculous treatment trials are sometimes used pragmatically in endemic settings where diagnostic certainty cannot otherwise be reached without unacceptable delay." }),
                React.createElement(Row, { c: "#f59e0b", label: "Diagnosis", val: "Histology (caseating granulomas) on biopsy, acid-fast bacilli (Ziehl-Neelsen) staining, mycobacterial culture (slow but remains a reference standard), and PCR-based nucleic acid amplification testing (faster turnaround) on biopsy tissue or ascitic fluid all contribute; ascitic fluid adenosine deaminase (ADA) level is a useful adjunct where tuberculous ascites/peritonitis coexists." }),
                React.createElement(Row, { c: "#f59e0b", label: "Management", val: "Standard multi-drug anti-tuberculous combination therapy (typically a rifampicin/isoniazid/pyrazinamide/ethambutol induction phase followed by a continuation phase) is first line and generally sufficient even for established strictures, which frequently improve with medical therapy alone as active inflammation resolves; surgery is reserved for complications not responding to medical treatment \u2014 persistent obstruction from a fibrotic (rather than purely inflammatory) stricture, perforation, or fistula formation." }),
                React.createElement(Ref, null, "Standard surgical/infectious disease teaching (Bailey & Love; Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-2b", title: "Intestinal Tuberculosis \u2014 Differential Diagnosis & Abdominal Patterns", icon: "\uD83D\uDD2C", color: "#f59e0b", compare: true },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Tuberculous ulcers classically run transverse (circumferential) to the long axis of the bowel, reflecting spread along lymphatics that themselves run circumferentially \u2014 Crohn's ulcers classically run longitudinal."),
                React.createElement(H, { color: "#f59e0b" }, "A Structured Comparison Against Crohn's Disease"),
                React.createElement(Row, { c: "#f59e0b", label: "Colonoscopic ulcer pattern", val: "Producing the 'cobblestone' mucosal appearance from intersecting longitudinal and transverse fissures; this single endoscopic pattern is one of the more reliable discriminators available before histology returns, though it is not infallible." }),
                React.createElement(Row, { c: "#f59e0b", label: "Nodal and radiological clues", val: "Tuberculous lymph nodes are frequently necrotic with central low attenuation on CT (from caseation) and may calcify with chronicity, whereas Crohn's-associated mesenteric lymphadenopathy is typically reactive and homogeneously enhancing without necrosis \u2014 'comb sign' (engorged vasa recta) is a described feature in active Crohn's rather than TB, though both can produce mesenteric fat stranding non-specifically." }),
                React.createElement(Row, { c: "#f59e0b", label: "Adjunctive tests", val: "A markedly raised ESR with a positive interferon-gamma release assay (IGRA) or tuberculin skin test supports TB in the correct epidemiological context, though a positive IGRA in a TB-endemic population only confirms prior exposure and does not itself prove active intestinal disease \u2014 this is precisely why histology and microbiological confirmation remain the diagnostic anchor rather than serology alone." }),
                React.createElement(Row, { c: "#f59e0b", label: "Response to empirical anti-tuberculous therapy", val: "Where genuine diagnostic uncertainty persists despite full work-up, a time-limited empirical trial of anti-tuberculous therapy with planned reassessment (clinical and endoscopic) at a defined interval is sometimes used pragmatically in endemic settings \u2014 a clear, defined response supports TB, while no response despite adherence should prompt reconsideration of Crohn's disease and initiation of appropriate immunosuppressive therapy instead." }),
                React.createElement(Warn, { title: "The risk of getting this wrong" }, "Treating Crohn's disease as tuberculosis delays appropriate immunosuppression and allows ongoing bowel damage; treating tuberculosis as Crohn's disease and starting immunosuppression/biologic therapy risks disseminating a previously localised mycobacterial infection into life-threatening miliary disease \u2014 this bidirectional risk is exactly why empirical treatment trials are only used when overall diagnostic uncertainty genuinely persists after exhausting available tests, not as a routine shortcut."),
                React.createElement(H, { color: "#f59e0b" }, "Extraintestinal Abdominal Patterns of TB"),
                React.createElement(Row, { c: "#f59e0b", label: "Tuberculous peritonitis \u2014 'wet', 'dry', and 'fibrotic' types", val: "The wet (ascitic) type produces free or loculated ascites with high protein content and a raised ascitic adenosine deaminase (ADA) level; the dry (plastic) type produces matted loops of bowel and omentum with little free fluid, sometimes presenting as a vague abdominal mass; the fibrotic type produces dense adhesions that can themselves cause chronic subacute obstruction independent of any active luminal disease \u2014 recognising which pattern is present matters, since the wet type is the most straightforward to sample (ascitic tap) while the dry/fibrotic types more often need laparoscopic or open biopsy to confirm." }),
                React.createElement(Row, { c: "#f59e0b", label: "Tuberculous lymphadenitis (abdominal Koch's)", val: "Isolated mesenteric or para-aortic nodal disease without overt luminal bowel involvement can present as a vague abdominal mass or pyrexia of unknown origin, and is diagnosed on image-guided or laparoscopic nodal biopsy when a luminal source is not identified on endoscopy." }),
                React.createElement(Ref, null, "Standard surgical/infectious disease teaching (Bailey & Love; Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-3", title: "Diverticular Disease \u2014 Pathophysiology & Uncomplicated Presentation", icon: "\uD83D\uDD35", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "A low-fibre diet reduces stool bulk, raising the intraluminal pressure required to propel the resulting smaller, harder stool \u2014 over years this pressure drives herniation of mucosa and submucosa through the muscular."),
                React.createElement(Row, { label: "Pathophysiology", val: "Wall at its points of natural weakness, specifically where the vasa recta penetrate the bowel wall to reach the mucosa, producing false (pulsion) diverticula lacking a muscular wall layer, unlike a true diverticulum such as Meckel's." }),
                React.createElement(Row, { c: "#f59e0b", label: "Distribution", val: "The sigmoid colon, subjected to the highest intraluminal pressures given its narrower lumen relative to the volume and consistency of stool it must propel, is by far the most commonly affected segment in Western populations \u2014 right-sided diverticular disease is comparatively more common in some Asian populations, a difference thought to relate partly to dietary fibre patterns and partly to genuine anatomical/genetic variation." }),
                React.createElement(Row, { c: "#f59e0b", label: "Uncomplicated diverticulosis", val: "The mere presence of diverticula, frequently an incidental finding on colonoscopy or CT performed for another reason, generally causing no symptoms at all \u2014 the terms 'diverticulosis' (asymptomatic presence of diverticula) and 'diverticulitis' (symptomatic inflammation of one or more diverticula) are frequently conflated but describe genuinely different clinical states requiring different management." }),
                React.createElement(Row, { c: "#f59e0b", label: "Symptomatic uncomplicated diverticular disease", val: "Recurrent left iliac fossa pain and altered bowel habit without overt inflammation or complication \u2014 managed conservatively with increased dietary fibre intake and simple analgesia, avoiding NSAIDs specifically since they are associated with a higher risk of diverticular complications including perforation." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-4", title: "Diverticular Disease \u2014 Complications", icon: "\u26A0\uFE0F", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Inflammation (often micro-perforation) of a diverticulum produces left iliac fossa pain, fever, and localised peritonism, with raised inflammatory markers \u2014 CT is the investigation of choice acutely."),
                React.createElement(Row, { label: "Acute diverticulitis", val: "Both confirming the diagnosis and grading severity/complications, and is generally preferred over colonoscopy in the acute setting given the perforation risk of insufflating an acutely inflamed colon." }),
                React.createElement(Row, { c: "#f59e0b", label: "The Hinchey classification", val: "Grades severity of any associated perforation: Hinchey I (localised pericolic abscess), Hinchey II (larger pelvic or distant abscess), Hinchey III (purulent peritonitis from a ruptured abscess), and Hinchey IV (faeculent peritonitis from free perforation) \u2014 management escalates directly with this grading, from antibiotics and observation (uncomplicated disease) or percutaneous drainage (small-to-moderate Hinchey I/II abscesses) through to emergency laparotomy with resection for Hinchey III/IV." }),
                React.createElement(Row, { c: "#f59e0b", label: "Hartmann's procedure", val: "Sigmoid colectomy with formation of an end colostomy and closure (rather than anastomosis) of the rectal stump, avoiding a primary anastomosis in a heavily contaminated, unprepared bowel field \u2014 the standard emergency operation for Hinchey III/IV perforated diverticulitis, with the option of later stoma reversal once the patient has recovered and inflammation has fully resolved, generally after a minimum interval of several months." }),
                React.createElement(Row, { c: "#f59e0b", label: "Diverticular bleeding", val: "Arises from erosion of a vasa recta stretched across the neck of a diverticulum, typically presenting as sudden, painless, often substantial rectal bleeding \u2014 the single most common cause of major lower GI bleeding, usually self-limiting given the colon's ability to compress the bleeding point as it contracts, but occasionally requiring angiographic embolisation or surgery (segmental or, if the bleeding source cannot be localised, subtotal colectomy) if it fails to settle." }),
                React.createElement(Row, { c: "#f59e0b", label: "Fistula formation", val: "Chronic diverticular inflammation can erode into an adjacent organ \u2014 a colovesical fistula (to the bladder) is the most common, classically presenting with pneumaturia (bubbles in the urine) and recurrent, sometimes polymicrobial urinary tract infections, and is far more common in men, since the uterus in women provides a protective anatomical barrier between colon and bladder; colovaginal fistula is the corresponding presentation more often seen in women, particularly those who have previously had a hysterectomy removing that protective barrier." }),
                React.createElement(Row, { c: "#f59e0b", label: "Stricture", val: "Repeated episodes of diverticulitis can produce a fibrotic colonic stricture radiologically indistinguishable from malignancy \u2014 colonoscopy and biopsy, once acute inflammation has fully settled (generally after 6 or more weeks, to avoid perforating an acutely inflamed segment), are required to exclude an underlying colorectal cancer before attributing a stricture to diverticular disease alone." }),
                React.createElement(Ref, null, "Hinchey classification of perforated diverticulitis; standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-4b", title: "Diverticular Disease \u2014 Management Nuances & Elective Surgery Timing", icon: "\uD83D\uDDC2\uFE0F", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Antibiotics have traditionally been considered routine for any diverticulitis, but growing trial evidence in genuinely uncomplicated, mild disease (no abscess, no perforation, well patient) supports a selective."),
                React.createElement(Row, { label: "Evolving antibiotic strategy for uncomplicated diverticulitis", val: "Symptomatic-management-only approach without antibiotics in appropriately selected cases \u2014 this represents a meaningful shift from blanket antibiotic use, mirroring similar de-escalation trends seen elsewhere in surgical infection management once trial evidence directly tests a long-standing default practice." }),
                React.createElement(Row, { c: "#f59e0b", label: "Outpatient vs inpatient management criteria", val: "Well, systemically stable patients with mild, uncomplicated diverticulitis, able to tolerate oral intake and with adequate home support and follow-up arranged, can frequently be managed as outpatients with oral antibiotics (where used) and analgesia \u2014 admission is reserved for systemic upset, inability to tolerate oral intake, significant comorbidity, immunosuppression (which both raises complication risk and can mask the severity of the underlying inflammation clinically), or any complicating feature on imaging (abscess, free air, obstruction)." }),
                React.createElement(Row, { c: "#f59e0b", label: "Elective resection after recovery \u2014 no longer a fixed 'two-episode rule'", val: "Older teaching recommended elective sigmoid colectomy after two episodes of diverticulitis regardless of severity; current practice has moved toward an individualised decision based on the severity of episodes experienced (a single severe, complicated episode may justify elective resection more than several mild uncomplicated ones), ongoing symptoms between episodes, immunosuppression status, and overall fitness for surgery \u2014 reflecting recognition that recurrent uncomplicated diverticulitis does not reliably predict a future complicated, life-threatening episode in the way the old fixed-count rule implied." }),
                React.createElement(Row, { c: "#f59e0b", label: "Right-sided diverticulitis", val: "More common in some Asian populations than the sigmoid-predominant pattern typical in Western populations, and can closely mimic acute appendicitis clinically given the shared right-sided location \u2014 CT is particularly valuable here in distinguishing the two, since the management pathways (antibiotics/conservative management for diverticulitis versus generally proceeding to appendectomy for appendicitis) differ substantially despite the overlapping presentation." }),
                React.createElement(Ref, null, "Hinchey classification; standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-4c", title: "Meckel's Diverticulum \u2014 Congenital vs Acquired, and Its Complications", icon: "\uD83C\uDF97\uFE0F", color: "#f59e0b", compare: true },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "A Meckel's diverticulum (see the Anatomy tab's 'rule of 2s') is a true, congenital diverticulum containing all layers of the bowel wall."),
                React.createElement(Row, { label: "Congenital vs acquired \u2014 the fundamental distinction", val: "Arising from incomplete obliteration of the vitellointestinal duct during embryological development \u2014 this is mechanistically entirely distinct from the acquired, false (pulsion) diverticula of colonic diverticular disease covered on the preceding cards, which lack a muscular wall layer and arise from raised intraluminal pressure over years rather than a congenital embryological remnant present from birth." }),
                React.createElement(Row, { c: "#f59e0b", label: "Why the distinction matters clinically", val: "Because a Meckel's diverticulum is congenital and often contains ectopic tissue (gastric or pancreatic mucosa), its complications differ substantially in both mechanism and typical age of presentation from acquired colonic diverticular disease \u2014 acquired diverticulitis is a disease of later adult life driven by diet and intraluminal pressure, while Meckel's complications cluster in childhood and young adulthood and are driven by the ectopic tissue or the diverticulum's physical presence as a structural anomaly." }),
                React.createElement(H, { color: "#f59e0b" }, "Complications of Meckel's Diverticulum"),
                React.createElement(Row, { c: "#f59e0b", label: "Meckel's diverticulitis", val: "Inflammation of the diverticulum, clinically indistinguishable from acute appendicitis in the great majority of cases preoperatively \u2014 surgeons are taught to specifically inspect a defined length of terminal ileum proximal to the ileocecal valve at appendectomy whenever the appendix itself is found to be unexpectedly normal, precisely to avoid missing an inflamed Meckel's diverticulum as the true cause of the presentation." }),
                React.createElement(Row, { c: "#f59e0b", label: "Painless lower GI bleeding", val: "The classical presentation in young children, caused by ectopic acid-secreting gastric mucosa within the diverticulum ulcerating the adjacent, unprotected ileal mucosa \u2014 a technetium-99m pertechnetate ('Meckel's') scan exploits the fact that this ectopic gastric mucosa avidly takes up the same tracer as normal gastric mucosa, allowing it to be localised non-invasively before surgery." }),
                React.createElement(Row, { c: "#f59e0b", label: "Intestinal obstruction", val: "A persistent fibrous band connecting the diverticulum to the umbilicus (a remnant of the vitellointestinal duct) can act as a point around which a loop of bowel volvulises, or can itself directly compress adjacent bowel \u2014 mechanistically distinct from the adhesional or hernia-related obstruction covered on the following Intestinal Obstruction cards, since this band is congenital rather than acquired from previous surgery." }),
                React.createElement(Row, { c: "#f59e0b", label: "Intussusception", val: "A Meckel's diverticulum can act as a pathological lead point, with the diverticulum and the adjacent bowel wall telescoping into the more distal bowel and dragging its mesentery with it \u2014 this is the congenital-lead-point counterpart to the small bowel tumour lead point covered later on this tab, and intussusception with an identifiable structural lead point (rather than the more common idiopathic, lymphoid-hyperplasia-related intussusception of young infants) should specifically prompt consideration of an underlying Meckel's diverticulum or tumour as the cause, particularly in an older child or adult presenting with intussusception rather than the classical infant age group." }),
                React.createElement(Row, { c: "#f59e0b", label: "Management", val: "A symptomatic Meckel's diverticulum is resected, either as a simple diverticulectomy (removing just the diverticulum, adequate where its base is narrow) or as a formal segmental small bowel resection (needed where the base is broad, or where adjacent bowel is compromised, such as in intussusception or volvulus around a fibrous band) \u2014 the management of an incidentally discovered, asymptomatic Meckel's diverticulum found during unrelated abdominal surgery remains genuinely debated, weighing the small lifetime risk of future complications against the additional operative time and risk of resecting an asymptomatic finding, and practice varies between surgeons and centres." }),
                React.createElement(Ref, null, "Rule of 2s; Meckel's (technetium) scan; standard surgical/paediatric surgery teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-5", title: "Intestinal Obstruction \u2014 Small Bowel", icon: "\uD83D\uDEA7", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Adhesions from previous abdominal surgery are the most common cause by far, followed by hernia (an incarcerated inguinal, femoral, or incisional hernia trapping bowel), and then malignancy."),
                React.createElement(Row, { label: "Causes, by frequency in developed countries", val: "(either primary small bowel tumour, covered later on this tab, or extrinsic compression/peritoneal disease from another cancer)." }),
                React.createElement(Row, { c: "#f59e0b", label: "Presentation", val: "Colicky central abdominal pain, vomiting (earlier and more prominent than in large bowel obstruction, given the shorter length of bowel proximal to a small bowel obstruction point), abdominal distension, and absolute constipation once the obstruction is complete \u2014 high-pitched, tinkling bowel sounds are classically described early, becoming quiet as the bowel progressively fatigues and dilates." }),
                React.createElement(Row, { c: "#f59e0b", label: "Investigation", val: "Erect and supine abdominal X-ray may show dilated small bowel loops with valvulae conniventes crossing the full width of the bowel (distinguishing small from large bowel gas pattern) and multiple air-fluid levels; CT with oral and IV contrast is more sensitive and specific, additionally identifying the transition point, the likely cause, and \u2014 critically \u2014 signs of strangulation (bowel wall thickening, reduced enhancement, mesenteric oedema, or free fluid)." }),
                React.createElement(H, { c: "#f59e0b" }, "Management"),
                React.createElement(PillarCard, { n: 1, total: 2, color: "#f59e0b", icon: "\uD83D\uDCA7", title: "'Drip and suck' \u2014 simple obstruction without strangulation", body: "Nasogastric tube decompression (removing swallowed air and secretions that would otherwise worsen distension) combined with intravenous fluid resuscitation (replacing losses from vomiting, third-spacing into the obstructed bowel lumen, and reduced oral intake) \u2014 standard initial conservative management, resolving the majority of adhesional cases without surgery." }),
                React.createElement(PillarCard, { n: 2, total: 2, color: "#ff4d6d", icon: "\uD83D\uDD2A", title: "Surgery \u2014 for strangulation, closed loop, or conservative failure", body: "Signs of strangulation (severe, constant rather than colicky pain, peritonism, tachycardia, rising lactate or inflammatory markers), a closed loop obstruction (see below), or failure of conservative management to resolve the obstruction over an appropriate observation period, generally 48\u201372 hours in an otherwise stable patient with adhesional obstruction." }),
                React.createElement(Warn, { title: "Do not delay for strangulation" }, "Persistent, severe, or worsening pain with systemic signs of sepsis in a patient being managed conservatively for obstruction should prompt urgent surgical reassessment rather than continued observation, since strangulated bowel can become irreversibly non-viable within hours of vascular compromise developing."),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-6", title: "Intestinal Obstruction \u2014 Large Bowel & Closed Loop", icon: "\uD83C\uDF00", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Colorectal cancer is the most common cause of large bowel obstruction in adults (see the companion file's Large Intestine tab for full detail), followed by sigmoid or caecal volvulus and diverticular stricture."),
                React.createElement(Row, { label: "Causes", val: "Distension is typically more marked and vomiting a later feature compared with small bowel obstruction, reflecting the greater length of bowel proximal to a distal colonic obstruction point." }),
                React.createElement(Row, { c: "#f59e0b", label: "Sigmoid and caecal volvulus", val: "Sigmoid volvulus (more common, typically in older, often institutionalised or chronically constipated patients with a redundant, mobile sigmoid loop and mesentery) classically shows a 'coffee bean' sign on abdominal X-ray; caecal volvulus (typically in younger patients with a congenitally mobile, poorly fixed caecum) shows a similarly rotated, dilated loop, often displaced toward the left upper quadrant \u2014 sigmoid volvulus is frequently managed initially with endoscopic (flexible sigmoidoscopic) decompression and detorsion, while caecal volvulus generally requires surgery given the higher risk of ischaemia and the technical difficulty of endoscopic detorsion at that location." }),
                React.createElement(SubHead, { color: "#f59e0b", icon: "\uD83D\uDD12" }, "Closed Loop Obstruction \u2014 the Danger Pattern"),
                React.createElement(Row, { c: "#f59e0b", label: "Mechanism", val: "Occurs when a bowel segment is obstructed at two points simultaneously \u2014 classically a competent ileocecal valve (see Anatomy tab) combined with a distal large bowel obstruction (such as an obstructing sigmoid or rectal cancer), or a volvulus twisting a loop shut at both ends \u2014 the trapped segment cannot decompress in either direction, so intraluminal pressure rises rapidly, compromising blood supply and progressing to ischaemia, necrosis, and perforation far faster than a simple, single-point obstruction." }),
                React.createElement(Row, { c: "#f59e0b", label: "Why this changes management", val: "A closed loop obstruction is a genuine surgical emergency requiring urgent rather than initially conservative management, since the trapped, rapidly distending segment (often the caecum, given its position proximal to the obstructing lesion and its relatively thin wall and wide diameter making it the point most likely to perforate first under Laplace's law) can perforate well before a typical 48\u201372 hour trial of conservative management would otherwise be considered." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-6b", title: "Adhesion Formation, Recurrence & the 'Virgin Abdomen'", icon: "\uD83D\uDD78\uFE0F", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Any peritoneal injury (surgical handling, desiccation from air exposure, infection, or blood in the peritoneal cavity) triggers a fibrinous exudate that, if not adequately broken down by peritoneal fibrinolytic activity."),
                React.createElement(SubHead, { color: "#f59e0b", icon: "\uD83D\uDD78\uFE0F" }, "Adhesion Formation & Prevention"),
                React.createElement(Row, { c: "#f59e0b", label: "Mechanism", val: "Within the first several days, organises into permanent fibrous adhesions bridging previously separate peritoneal surfaces \u2014 adhesions are therefore, in a sense, the peritoneal cavity's equivalent of a healing scar, and essentially any abdominal surgery carries some risk of producing them." }),
                React.createElement(Row, { c: "#f59e0b", label: "Why minimally invasive surgery reduces adhesion burden", val: "Laparoscopic surgery causes less peritoneal desiccation, less direct tissue handling, and a smaller overall wound compared with open surgery, and is associated with meaningfully lower rates of subsequent adhesional small bowel obstruction \u2014 this is one of the less commonly emphasised but genuinely significant long-term benefits of the minimally invasive approach, distinct from its more familiar short-term recovery advantages." }),
                React.createElement(Row, { c: "#f59e0b", label: "Adhesion barriers", val: "Physical barrier materials placed between raw peritoneal surfaces at the end of surgery can reduce adhesion formation at the site they are applied, though their use is generally selective (high-risk sites, patients anticipated to need further surgery) rather than routine in every laparotomy, given their cost and the fact that they cannot prevent adhesions at sites they do not directly cover." }),
                React.createElement(SubHead, { color: "#f59e0b", icon: "\uD83D\uDD01" }, "Recurrent Adhesional Obstruction"),
                React.createElement(Row, { c: "#f59e0b", label: "Repeat conservative management vs adhesiolysis", val: "A patient with a well-documented history of adhesional obstruction who re-presents with a similar, uncomplicated picture can often be managed with a further trial of conservative 'drip and suck' management exactly as before, since the underlying cause is already known and unlikely to have changed \u2014 surgical adhesiolysis is reserved for the same red flags as any first obstruction episode (signs of strangulation, closed loop, or failure of conservative management), not simply offered by default because a patient has had a previous episode, since surgery for adhesions itself risks creating yet more adhesions." }),
                React.createElement(SubHead, { color: "#f59e0b", icon: "\uD83C\uDD95" }, "The 'Virgin Abdomen' \u2014 a Genuinely Different Differential"),
                React.createElement(Row, { c: "#f59e0b", label: "Why the differential shifts", val: "A patient presenting with bowel obstruction who has never had previous abdominal surgery cannot have adhesional obstruction (by definition, since there is no prior surgical trauma to have caused adhesions) \u2014 this single fact meaningfully re-weights the differential toward hernia (an easily missed femoral or obturator hernia, in particular, given how subtle these can be on examination), malignancy, volvulus, an undiagnosed underlying Crohn's stricture, or, rarely, a congenital band or malrotation only becoming symptomatic in adulthood." }),
                React.createElement(Warn, { title: "A lower threshold for imaging and intervention" }, "Obstruction in a virgin abdomen should generally prompt a lower threshold for cross-sectional imaging and surgical involvement than a straightforward re-presentation of known adhesional disease, since a genuine structural or malignant cause is more likely to be found and the 'default' expectant management appropriate for known adhesions is less clearly justified when the cause is not already established."),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-7", title: "Stomas \u2014 Types & Siting", icon: "\u2B55", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "The proximal bowel is brought out as the only opening, with the distal segment either removed or closed off (as in a Hartmann's procedure, covered on the diverticular disease card)."),
                React.createElement(Table, { color: "#f59e0b", headers: ["Stoma type", "Key features"], rows: [
                        ["End stoma", "Used when restoring continuity is unsafe or impossible at the index operation; may be temporary (reversible later) or permanent depending on underlying pathology and whether the distal bowel/anus remains present and functional"],
                        ["Loop stoma", "A loop of bowel is brought out with both the proximal (functioning) and distal (defunctioned) limbs opening onto the abdominal wall side by side, without dividing the bowel — used to defunction a distal anastomosis or area of disease temporarily, and generally easier to reverse since the bowel was never fully divided, making a loop ileostomy the standard choice for temporarily protecting a low rectal anastomosis"],
                        ["Ileostomy vs colostomy — output character", "Ileostomy: continuous, liquid, enzyme-rich output that is directly irritant to skin (relevant to siting/appliance choice) and carries the high-output risk covered on the next card. Colostomy: more formed, intermittent output, positioned further along the tract where water has already been reabsorbed — generally easier to manage day-to-day"],
                        ["Feeding jejunostomy — a functionally distinct type", "Generally not created for faecal diversion at all but as a dedicated enteral feeding access route, most often placed at the time of a major upper GI operation (oesophagectomy, gastrectomy) in anticipation of a period where oral intake will be unsafe — a fine feeding tube delivers enteral nutrition directly beyond the operated segment while it heals"],
                    ] }),
                React.createElement(H, { color: "#f59e0b" }, "Siting Principles"),
                React.createElement(Row, { c: "#f59e0b", label: "Preoperative marking", val: "Ideally marked by a stoma nurse specialist before surgery, avoiding skin creases, scars, bony prominences, and the umbilicus, and positioned where the patient can see and reach it themselves, and where an appliance will sit flat even when the patient is sitting \u2014 sited within the rectus abdominis muscle specifically to reduce the risk of subsequent parastomal herniation, since the muscle provides mechanical support the surrounding fascia alone does not." }),
                React.createElement(Ref, null, "Standard surgical/stoma care teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-8", title: "Stomas \u2014 Complications & High-Output Management", icon: "\u26A0\uFE0F", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "The recognised early and late complications of a stoma, from retraction and prolapse to the specific fluid and electrolyte dangers of a high-output stoma."),
                React.createElement(List, { c: "#f59e0b", items: [
                        "Retraction — the stoma sinks below skin level, often from excess tension or inadequate mobilisation, predisposing to leakage and skin breakdown.",
                        "Prolapse — excessive length of bowel protrudes through the stoma, more common with loop stomas and transverse loop colostomies specifically.",
                        "Parastomal hernia — bowel or omentum herniates through the abdominal wall defect around the stoma, the most common long-term stoma complication, and more likely with poor siting outside the rectus muscle.",
                        "Stenosis — narrowing of the stoma opening, causing obstructive symptoms and difficulty with appliance fitting.",
                        "Ischaemia/necrosis — inadequate blood supply to the exteriorised bowel, typically recognised in the early postoperative period by a dusky or frankly black stoma requiring urgent surgical reassessment, since necrosis can extend below skin level even when the visible mucosa looks only mildly affected.",
                        "Skin excoriation — particularly with ileostomies given their continuous, enzyme-rich output, managed with well-fitted appliances and barrier products rather than tolerated as an inevitable nuisance.",
                    ] }),
                React.createElement(Row, { c: "#f59e0b", label: "High-output stoma \u2014 definition and risk", val: "Particularly relevant to ileostomies, which lack the fluid- and electrolyte-reabsorbing function of the colon \u2014 output above roughly 1.5\u20132 litres per day risks significant dehydration, hyponatraemia, hypomagnesaemia, and acute kidney injury, and is one of the more common causes of stoma-related hospital readmission." }),
                React.createElement(Row, { c: "#f59e0b", label: "Management", val: "Fluid restriction of hypotonic oral fluids specifically (which paradoxically worsen net fluid loss through the stoma by drawing sodium from the body into the gut lumen to equilibrate, rather than being genuinely absorbed), oral rehydration solution formulated to match stomal losses, and anti-motility agents such as loperamide \u2014 often at higher-than-standard doses, and taken before meals \u2014 to slow transit and improve absorption time." }),
                React.createElement(Ref, null, "Standard surgical/stoma care teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-8b", title: "Stoma Reversal & Patient Education", icon: "\uD83D\uDD04", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Generally deferred at least 8\u201312 weeks after formation to allow full resolution of postoperative inflammation and adhesion formation to settle to a degree that makes safe dissection feasible \u2014 reversal significantly."),
                React.createElement(H, { color: "#f59e0b" }, "Reversal of a Temporary Stoma"),
                React.createElement(Row, { c: "#f59e0b", label: "Timing", val: "Earlier than this carries a higher risk of injury to densely adherent, still-inflamed adjacent bowel during mobilisation." }),
                React.createElement(Row, { c: "#f59e0b", label: "Confirming safety to reverse", val: "A contrast study (a water-soluble contrast enema for a defunctioned distal colon/rectum, or a similar study for a small bowel anastomosis) is generally performed before reversal to confirm there is no distal stricture, ongoing anastomotic leak, or other pathology that would make reversal unsafe \u2014 proceeding straight to reversal without this confirmation risks restoring continuity onto a distal segment that is not actually ready to receive it." }),
                React.createElement(Row, { c: "#f59e0b", label: "Why some 'temporary' stomas become permanent", val: "A stoma originally intended as temporary can become permanent if the underlying disease progresses (e.g. worsening Crohn's disease precluding safe reversal), if the patient's overall fitness declines such that a further anaesthetic and operation carries unacceptable risk, or if the patient, once accustomed to life with a stoma, elects not to proceed with reversal \u2014 this last reason is a genuine and entirely valid patient choice that should be respected rather than assumed to reflect a failure of the original surgical plan." }),
                React.createElement(H, { color: "#f59e0b" }, "Patient Education & Psychological Impact"),
                React.createElement(Row, { c: "#f59e0b", label: "Body image and psychological adjustment", val: "A new stoma represents a significant change to body image and independence, and adjustment difficulties (anxiety, low mood, altered intimacy and relationships, changes in clothing choices and social confidence) are common and should be actively and routinely asked about rather than assumed to be resolved once the physical wound has healed \u2014 stoma nurse specialists play a central, ongoing role here, not just in the immediate perioperative teaching period." }),
                React.createElement(Row, { c: "#f59e0b", label: "Dietary advice \u2014 ileostomy vs colostomy", val: "Ileostomy patients are generally advised to chew food thoroughly and introduce high-fibre or fibrous foods cautiously, since poorly chewed fibrous material (nuts, certain vegetables, dried fruit skins) can cause a food bolus obstruction at the stoma outlet given the already-narrower calibre of a freshly formed stoma; colostomy patients generally have fewer specific dietary restrictions given the more formed nature of colostomy output, though individual food-related gas or odour triggers are still commonly discussed." }),
                React.createElement(Row, { c: "#f59e0b", label: "Colostomy irrigation", val: "Some end colostomy patients can be taught colostomy irrigation \u2014 instilling water through the stoma on a regular schedule to regulate bowel emptying at a predictable time, allowing longer stoma-bag-free intervals between motions \u2014 a genuine option for suitable, motivated patients with an end (rather than loop) colostomy that meaningfully improves quality of life and confidence for some, though it is not appropriate or desired by every patient." }),
                React.createElement(Ref, null, "Standard surgical/stoma care teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-9", title: "Enterocutaneous & Other GI Fistulas", icon: "\uD83D\uDD73\uFE0F", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "Low-output fistulas (under roughly 200 mL/day) are more likely to close spontaneously with conservative management; high-output fistulas (over roughly 500 mL/day) carry a much lower spontaneous closure rate and cause."),
                React.createElement(Row, { label: "Classification by output", val: "More severe fluid, electrolyte, and nutritional derangement, often needing earlier surgical intervention rather than prolonged conservative trial." }),
                React.createElement(Row, { c: "#f59e0b", label: "Causes", val: "Anastomotic leak following bowel surgery is the most common cause of a postoperative enterocutaneous fistula; Crohn's disease (given its transmural, fistulating nature, see earlier cards), malignancy, radiotherapy, and infection/abscess are the other major causes." }),
                React.createElement(Mnem, { title: "'FRIEND' \u2014 Factors Preventing Spontaneous Fistula Closure", items: [
                        "F — Foreign body within the fistula tract",
                        "R — Radiation-damaged tissue",
                        "I — Infection/Inflammatory bowel disease at the fistula origin",
                        "E — Epithelialisation of the fistula tract, preventing it from granulating shut",
                        "N — Neoplasm at the origin",
                        "D — Distal obstruction, which maintains pressure driving flow through the fistula rather than the normal bowel lumen",
                    ] }),
                React.createElement(Row, { c: "#f59e0b", label: "Investigation", val: "Fistulography, CT with oral/rectal contrast, or a contrast swallow/enema can define the tract's origin, course, and any associated collection \u2014 this anatomical mapping guides both the feasibility of conservative management and, if needed, precise surgical planning." }),
                React.createElement(Row, { c: "#f59e0b", label: "Management principles", val: "Sepsis control (drainage of any associated collection, antibiotics), skin protection around the fistula site (stoma-nurse-led care to prevent painful excoriation from enteric content), nutritional support (often requiring parenteral nutrition in high-output fistulas where enteral intake cannot keep pace with losses), and correcting any of the 'FRIEND' factors above \u2014 definitive surgical closure is deliberately delayed until sepsis has resolved and nutritional status has been optimised, since operating on a septic, malnourished patient with hostile, inflamed tissue carries a high re-leak rate; this delay is frequently measured in months, not days." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-9b", title: "Specific Fistula Patterns \u2014 Enterovesical, Enterovaginal & Enteroenteric", icon: "\uD83D\uDD17", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "A connection between bowel and bladder, most commonly from diverticular disease (see the companion Colon tab) or, less often, Crohn's disease or a locally invasive colorectal/bladder malignancy \u2014 classically presents."),
                React.createElement(Table, { color: "#f59e0b", headers: ["Fistula type", "Key features"], rows: [
                        ["Enterovesical (colovesical/ileovesical)", "Connection between bowel and bladder, most commonly from diverticular disease or, less often, Crohn's disease or a locally invasive colorectal/bladder malignancy — pneumaturia (bubbles in urine, from bowel gas entering the bladder), faecaluria (a more specific but less consistently present sign), and recurrent, sometimes polymicrobial UTIs that fail to fully clear with standard antibiotics. Markedly more common in men, since the uterus provides a protective barrier in women"],
                        ["Enterovaginal", "The corresponding presentation more often seen in women, particularly after hysterectomy or with Crohn's disease affecting the rectum/sigmoid near the vaginal vault — faeculent or gaseous vaginal discharge, a source of significant psychological and social distress that shouldn't be underestimated when planning management timelines"],
                        ["Enteroenteric (internal)", "A tract connecting two loops of bowel directly, most classically an ileosigmoid fistula in Crohn's disease — functionally bypasses a variable length of bowel, producing diarrhoea, malabsorption, and bacterial overgrowth. No external or urinary/vaginal drainage to alert the clinician, making it easier to miss without deliberate imaging"],
                    ] }),
                React.createElement(Warn, { title: "Aortoenteric fistula \u2014 a rare but lethal mimic" }, "A fistula between the aorta (native, or more commonly a previous aortic graft) and an adjacent segment of bowel \u2014 classically the third/fourth part of the duodenum given its retroperitoneal proximity to the aorta (see the Anatomy tab) \u2014 presents with GI bleeding that may be a smaller 'herald bleed' preceding a subsequent massive, catastrophic haemorrhage; any patient with a history of aortic aneurysm repair or graft presenting with GI bleeding, however minor, should have this specifically excluded before being managed as a routine upper GI bleed, since missing it is rapidly fatal."),
                React.createElement(Row, { c: "#f59e0b", label: "Imaging approach across fistula types", val: "CT with oral, rectal, and/or IV contrast is generally the first-line investigation across all these fistula types, since it can simultaneously demonstrate the tract, any associated collection, and, for enterovesical fistulas, gas within an otherwise non-instrumented bladder (a highly specific indirect sign even when the tract itself is not directly visualised); cystoscopy, vaginal examination with speculum, and contrast enema/fistulography are useful targeted adjuncts once the general pattern is suspected from CT and clinical context." }),
                React.createElement(Ref, null, "Standard surgical teaching (Bailey & Love).")),
            React.createElement(DiseaseCard, { id: "card-9c", title: "The 'SNAP' Framework & Nutritional/Psychological Support in Fistula Care", icon: "\uD83E\uDDED", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "A structured way of organising fistula management into four sequential, overlapping priorities \u2014 Sepsis."),
                React.createElement(Row, { label: "The SNAP framework", val: "(control infection and drain any collection first, since nothing else can safely proceed while the patient remains septic), Nutrition (optimise nutritional status, since a malnourished patient heals poorly and tolerates further surgery badly), Anatomy (fully characterise the fistula's origin, course, and any associated pathology once the patient is stable enough for definitive imaging), and Procedure (plan and perform definitive surgical closure only once the preceding three priorities have been addressed) \u2014 this sequence directly mirrors, and gives a memorable structure to, the delayed-definitive-surgery principle already covered on the main fistula card." }),
                React.createElement(Row, { c: "#f59e0b", label: "Choosing enteral vs parenteral nutrition", val: "Enteral nutrition (oral or via a feeding tube placed distal to the fistula where anatomically feasible) is preferred wherever it can be safely delivered without simply increasing fistula output, since it better preserves gut mucosal integrity and reduces infective complications compared with parenteral nutrition; a high-output proximal fistula, or one where enteral feeding directly worsens output and delays closure, generally requires parenteral nutrition instead, at least until output has reduced or a distal feeding route can be established." }),
                React.createElement(Row, { c: "#f59e0b", label: "Psychological and body-image impact", val: "Living with an enterocutaneous fistula \u2014 the unpredictable leakage, odour, need for specialised dressings or collection devices, and the sheer duration over which definitive closure is often deliberately delayed (frequently months) \u2014 carries a substantial psychological burden that parallels, and in some respects exceeds, the adjustment difficulties described for stomas earlier on this tab, since a fistula (unlike a formed stoma) is rarely a neat, contained opening and can feel less controllable to the patient; the same multidisciplinary, actively-asked-about psychological support applied to stoma patients applies equally here, not only to the physical sepsis/nutrition/anatomy/procedure sequence." }),
                React.createElement(Ref, null, "Standard surgical/nutrition teaching (Bailey & Love; Kumar & Clark).")),
            React.createElement(DiseaseCard, { id: "card-10", title: "Short Bowel Syndrome", icon: "\uD83D\uDCCF", color: "#f59e0b" },
                React.createElement(Box, { color: "#f59e0b", title: "Overview" }, "A malabsorptive state arising when remaining functional small bowel \u2014 generally considered to be under roughly 200 cm in an adult."),
                React.createElement(Row, { label: "Definition", val: "Though the functional threshold varies with which segments remain and the health of the residual bowel and colon \u2014 is insufficient to maintain adequate nutrition and hydration without specialised support." }),

                React.createElement(Row, { c: "#14b8a6", label: "Management", val: "Addressing the underlying defaecatory dysfunction \u2014 biofeedback therapy for paradoxical puborectalis contraction, treating any underlying rectal prolapse, and dietary/behavioural measures to reduce straining \u2014 rather than simply treating the ulcer itself in isolation, since the ulcer is a downstream consequence of the mechanical problem rather than a primary disease process to target directly." }),

                React.createElement(Box, { color: "#14b8a6", title: "Overview" }, "The great majority of colorectal cancers arise from a pre-existing adenomatous polyp accumulating sequential genetic mutations (classically APC, then KRAS, then p53) over years \u2014 this sequence is the entire biological."),
                React.createElement(Row, { label: "The adenoma-carcinoma sequence", val: "Rationale behind population screening and polypectomy, since removing an adenoma before it accumulates the full mutational sequence prevents the cancer that would otherwise eventually arise from it." }),
                React.createElement(Row, { c: "#14b8a6", label: "Sporadic risk factors", val: "Increasing age, a diet high in red/processed meat and low in fibre, obesity, smoking, alcohol, and longstanding ulcerative colitis (covered on the earlier cards on this tab) \u2014 most colorectal cancer is sporadic rather than hereditary, but the hereditary syndromes below are disproportionately important given their high individual risk and the specific surveillance/prophylactic strategies they demand." }),
                React.createElement(Row, { c: "#14b8a6", label: "Familial adenomatous polyposis (FAP)", val: "An APC gene mutation producing hundreds to thousands of colonic adenomas from adolescence onward, with near-certain progression to cancer by middle age if untreated \u2014 generally managed with prophylactic proctocolectomy (or total colectomy with ileorectal anastomosis, accepting ongoing rectal surveillance, in selected cases with a lower rectal polyp burden) once polyps are established, alongside surveillance for extracolonic manifestations including duodenal polyps and desmoid tumours." }),
                React.createElement(Row, { c: "#14b8a6", label: "Lynch syndrome (hereditary non-polyposis colorectal cancer)", val: "Mismatch repair gene mutations (MLH1, MSH2, MSH6, PMS2) producing a markedly increased colorectal cancer risk without the florid polyposis of FAP, along with an increased risk of endometrial and several other cancers \u2014 the Amsterdam and Bethesda criteria historically helped identify families warranting genetic testing based on family history pattern, though tumour testing (microsatellite instability/immunohistochemistry for mismatch repair protein loss) on any newly diagnosed colorectal cancer is now increasingly used as a universal screening step rather than relying on family history criteria alone; confirmed carriers undergo intensive surveillance colonoscopy from a young age and gynaecological surveillance/risk-reducing surgery discussions." }),
                React.createElement(Ref, null, "Amsterdam/Bethesda criteria; NICE NG151; standard surgical/oncology teaching.")),
            React.createElement(DiseaseCard, { id: "card-4b", title: "Benign Colonic Polyps \u2014 Classification & Why It Predicts Risk", icon: "\uD83D\uDFE2", color: "#14b8a6", compare: true },
                React.createElement(Box, { color: "#14b8a6", title: "Overview" }, "The number, size, and histological type of polyps found at a single colonoscopy directly determines how soon the next surveillance colonoscopy is recommended, making polyp classification a genuinely forward-looking risk-stratification tool rather than simply a descriptive label for what was removed."),
                React.createElement(SubHead, { c: "#14b8a6", icon: "\uD83D\uDFE2" }, "Hyperplastic Polyps"),
                React.createElement(Row, { c: "#14b8a6", label: "Nature and risk", val: "The most common colonic polyp overall, arising from a non-neoplastic overgrowth of otherwise normal mucosal cells \u2014 carry essentially no malignant potential when small and distal (most are found in the rectosigmoid), and are the polyp type a clinician can most confidently reassure a patient about, though larger or more proximal hyperplastic-appearing polyps are still generally removed and sent for histology to confirm they are not part of the serrated pathway below." }),
                React.createElement(SubHead, { c: "#14b8a6", icon: "\uD83D\uDFE1" }, "Adenomatous Polyps \u2014 the Classical Premalignant Lesion"),
                React.createElement(Row, { c: "#14b8a6", label: "Tubular, villous, and tubulovillous subtypes", val: "Classified by glandular architecture \u2014 tubular adenomas are the most common and generally carry the lowest individual malignant risk; villous adenomas carry the highest malignant risk per polyp and are more likely to be larger, sessile, and to cause symptomatic secretory diarrhoea or, rarely, hypokalaemia from potassium-rich mucus secretion; tubulovillous adenomas sit histologically and in risk between the two. This tissue architecture, together with polyp size and degree of dysplasia, is what actually drives the adenoma-carcinoma sequence introduced on the epidemiology card, rather than the mere presence of a polyp being the risk factor in itself." }),
                React.createElement(SubHead, { c: "#14b8a6", icon: "\uD83D\uDD34" }, "Serrated Polyps \u2014 a Distinct, More Recently Characterised Pathway"),

            React.createElement(DiseaseCard, { id: "card-5", title: "Colorectal Cancer \u2014 Presentation, Staging & Screening", icon: "\uD83D\uDD0E", color: "#14b8a6" },
                React.createElement(Box, { color: "#14b8a6", title: "Overview" }, "Right- and left-sided colon cancers present differently because of differences in luminal calibre and stool consistency along the colon \u2014 a distinction worth knowing before considering rectal cancer's own distinct presentation below."),
                React.createElement(SubHead, { c: "#14b8a6", icon: "\uD83E\uDDED" }, "Presentation by Side"),
                React.createElement(Table, { headers: ["Side", "Typical Presentation"], rows: [
                        ["Right-sided (caecal/ascending)", "Presents later and more insidiously, with iron deficiency anaemia and occult bleeding — the wider luminal calibre and more liquid stool of the right colon allow a tumour to grow substantially before causing obstruction."],
                        ["Left-sided (descending/sigmoid)", "Presents earlier with a change in bowel habit, rectal bleeding, or obstruction — the narrower lumen and more formed stool make even a moderate-sized annular tumour obstructive relatively quickly."],

                React.createElement(Row, { c: "#14b8a6", label: "Rectal cancer-specific presentation", val: "Tenesmus (a sensation of incomplete evacuation from a mass occupying rectal space), rectal bleeding often mixed with mucus, and, with more advanced/low tumours, symptoms from local invasion of adjacent structures (bladder, vagina, sacral plexus causing pain) \u2014 digital rectal examination remains an essential, low-cost part of assessment given how many rectal cancers are palpable within reach of an examining finger." }),
                React.createElement(Row, { c: "#14b8a6", label: "Staging investigations", val: "Colonoscopy with biopsy confirms the diagnosis and excludes synchronous lesions elsewhere in the colon; CT chest/abdomen/pelvis assesses local invasion and distant metastasis (liver and lung being the most common sites); MRI pelvis is specifically added for rectal cancer to assess the circumferential resection margin and mesorectal nodal involvement with a precision CT cannot match, directly informing the neoadjuvant chemoradiotherapy decision covered on the next card; endorectal ultrasound is an alternative/adjunct for assessing depth of invasion in early rectal tumours being considered for local excision." }),
                React.createElement(Row, { c: "#14b8a6", label: "Staging systems", val: "TNM (8th edition) is now standard, having largely superseded the older Dukes' classification (A: confined to bowel wall, B: through the bowel wall, C: lymph node involvement, D: distant metastasis) in formal reporting, though Dukes' staging remains widely referenced conceptually given its historical prominence and intuitive structure." }),
                React.createElement(Row, { c: "#14b8a6", label: "Screening", val: "Population faecal immunochemical testing (FIT), which detects small amounts of blood in stool more specifically for human haemoglobin than older guaiac-based tests, followed by colonoscopy for positive results, underlies most national bowel cancer screening programmes, aiming to detect both early cancers and pre-malignant adenomas before they progress \u2014 screening sensitivity and population uptake are both major determinants of a programme's real-world impact on colorectal cancer mortality, independent of the test's laboratory performance characteristics." }),
                React.createElement(Ref, null, "NICE NG151; TNM 8th edition; Dukes' classification.")),
            React.createElement(DiseaseCard, { id: "card-6", title: "Colorectal Cancer \u2014 Surgical & Adjuvant Management", icon: "\uD83D\uDD2A", color: "#14b8a6" },
                React.createElement(Box, { color: "#14b8a6", title: "Overview" }, "Surgical resection is matched to tumour site, following the anatomical blood supply and lymphatic drainage of each colonic segment; rectal cancer surgery follows its own distinct set of principles given the rectum's fixed pelvic location."),
                React.createElement(SubHead, { c: "#14b8a6", icon: "\uD83D\uDD2A" }, "Surgical Management by Site"),
                React.createElement(Table, { headers: ["Tumour Site", "Operation"], rows: [
                        ["Caecal/ascending colon & proximal transverse colon", "Right hemicolectomy."],
                        ["Descending colon", "Left hemicolectomy."],
                        ["Sigmoid colon", "Sigmoid colectomy."],
                        ["Upper and mid rectum", "Anterior resection (preserving the anal sphincter)."],
                        ["Low rectum, inadequate distal margin", "Abdominoperineal resection (APR) — removing the rectum, anus, and sphincter complex with formation of a permanent colostomy, used where an adequate distal margin cannot be achieved while preserving continence."],

                React.createElement(Row, { c: "#14b8a6", label: "Total mesorectal excision (TME)", val: "The standard technique for rectal cancer surgery, removing the rectum together with its surrounding mesorectal fat and lymph nodes as a single, intact envelope along the correct anatomical plane \u2014 meticulous TME technique is directly linked to lower local recurrence rates, since incomplete or torn mesorectal excision leaves behind exactly the nodal tissue most likely to harbour residual disease." }),
                React.createElement(Row, { c: "#14b8a6", label: "Adjuvant chemotherapy", val: "Offered for node-positive (and select high-risk node-negative, e.g. poorly differentiated or with lymphovascular invasion) colon cancer following resection, aiming to eradicate micrometastatic disease not visible on staging imaging." }),
                React.createElement(Row, { c: "#14b8a6", label: "Neoadjuvant therapy for rectal cancer", val: "Locally advanced rectal cancer (threatened or involved circumferential resection margin on MRI, or bulky nodal disease) frequently receives neoadjuvant (pre-operative) long-course chemoradiotherapy or short-course radiotherapy specifically to downstage the tumour and reduce local recurrence before surgery \u2014 this reflects the rectum's fixed pelvic location and closer proximity to the circumferential resection margin than intraperitoneal colon, where equivalent local recurrence risk simply does not arise in the same way." }),
                React.createElement(Row, { c: "#14b8a6", label: "'Watch and wait' after complete clinical response", val: "A minority of rectal cancer patients achieve a complete clinical response to neoadjuvant chemoradiotherapy (no detectable residual tumour on repeat MRI/endoscopy) \u2014 in carefully selected, closely monitored patients, surgery can sometimes be deferred and replaced with intensive surveillance, avoiding the morbidity of major rectal surgery (including permanent stoma in low tumours) at the cost of a real risk of local regrowth requiring salvage surgery if detected on follow-up." }),
                React.createElement(Ref, null, "Total mesorectal excision (Heald); NICE NG151; standard surgical/oncology teaching.")))),
