<title>GIT Surgery</title>

<style>
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; padding: 0; background: #000; }
  body {
    font-family: "Spectral", Georgia, serif;
    color: #e2e8f0;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font-family: inherit; }

  /* Shell */
  .app { height: 100%; display: flex; flex-direction: column; background: #000; }
  .topbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    background: rgba(8,8,8,0.92); border-bottom: 1px solid #1e1e1e;
  }
  .topbar__back {
    border: 1px solid #22c55e44; background: #22c55e14; color: #22c55e;
    border-radius: 18px; padding: 6px 13px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .topbar__title { flex: 1; text-align: center; font-size: 11px; letter-spacing: .21em; text-transform: uppercase; color: #4e6280; }
  .topbar__spacer { width: 64px; }

  /* The modules call resetScrollTop() on #caliph-module-scroll — keep this id */
  #caliph-module-scroll {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom); scrollbar-width: none;
  }
  #caliph-module-scroll::-webkit-scrollbar { display: none; }
  .caliph-wrap { background: #000; min-height: 100%; }
  .caliph-wrap, .caliph-wrap * { -webkit-tap-highlight-color: transparent; }
  .caliph-wrap .surg-serif-scope, .caliph-wrap .surg-serif-scope * { font-family: 'Spectral', serif !important; }

  /* Home */
  .home { max-width: 520px; margin: 0 auto; padding: 34px 18px 60px; }
  .home__eyebrow { font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: #4e6280; text-align: center; }
  .home__title {
    font-size: 34px; font-weight: 800; text-align: center; margin: 6px 0 4px; letter-spacing: -.5px;
    background: linear-gradient(135deg,#fff 15%,#22c55e 60%,#15803d 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .home__sub { text-align: center; color: #94a3b8; font-size: 14px; margin: 0 0 28px; line-height: 1.6; }
  .tile {
    display: block; width: 100%; text-align: left; cursor: pointer; margin-bottom: 14px;
    padding: 18px 18px 16px; border-radius: 16px; color: #e2e8f0;
    border: 1px solid var(--c)55; border-left: 4px solid var(--c);
    background: linear-gradient(135deg, var(--c)1c, #0c0c0c 70%);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tile:active { transform: scale(.985); box-shadow: 0 0 22px -6px var(--c); }
  .tile__part { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--c); font-weight: 700; }
  .tile__name { font-size: 21px; font-weight: 700; margin: 4px 0 6px; }
  .tile__desc { font-size: 13px; color: #94a3b8; line-height: 1.6; }
  .tile__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .chip { font-size: 10.5px; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--c)44; color: var(--c); }
  .tile__resume { margin-top: 10px; font-size: 11px; color: #4e6280; }
  .home__foot { text-align: center; font-size: 11px; color: #3f4a5e; margin-top: 26px; font-family: 'JetBrains Mono', monospace; }

  /* ═══ Decree pop-up ═══ */
  .decree {
    --gold:#e8c46a; --gold2:#a8801f; --blood:#b3122b;
    position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    background: radial-gradient(ellipse at 50% 30%, #3a0510 0%, #12020a 45%, #000 80%);
    overflow: hidden; animation: dcFade .5s ease-out both;
  }
  .decree--out { animation: dcOut .6s ease-in both; pointer-events: none; }
  @keyframes dcFade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes dcOut { to { opacity: 0; transform: scale(1.06); filter: blur(6px) } }
  .decree__ember {
    position: absolute; bottom: -10px; border-radius: 50%; background: #ff7a3c;
    box-shadow: 0 0 8px 2px rgba(255,110,40,.7); opacity: 0;
    animation: dcRise linear infinite;
  }
  @keyframes dcRise { 0% { transform: translateY(0) translateX(0); opacity: 0 } 12% { opacity: .9 }
    100% { transform: translateY(-105vh) translateX(var(--dx)); opacity: 0 } }
  .decree__card {
    position: relative; width: 100%; max-width: 410px; max-height: 100%; overflow-y: auto; scrollbar-width: none;
    text-align: center; padding: 30px 22px 26px; border-radius: 4px;
    background: linear-gradient(180deg, rgba(30,4,12,.94), rgba(6,1,3,.97));
    border: 1px solid var(--gold2);
    box-shadow: 0 0 0 5px #000, 0 0 0 6px rgba(232,196,106,.35), 0 0 70px -8px rgba(179,18,43,.75), inset 0 0 60px rgba(179,18,43,.18);
    animation: dcRiseIn 1s cubic-bezier(.2,.8,.2,1) .15s both;
  }
  .decree__card::-webkit-scrollbar { display: none; }
  @keyframes dcRiseIn { from { opacity: 0; transform: translateY(26px) scale(.96) } to { opacity: 1; transform: none } }
  .decree__corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--gold); opacity: .9; }
  .decree__corner--tl { top: 7px; left: 7px; border-right: 0; border-bottom: 0; }
  .decree__corner--tr { top: 7px; right: 7px; border-left: 0; border-bottom: 0; }
  .decree__corner--bl { bottom: 7px; left: 7px; border-right: 0; border-top: 0; }
  .decree__corner--br { bottom: 7px; right: 7px; border-left: 0; border-top: 0; }
  .decree__sigil { width: 96px; height: 96px; margin: 0 auto 10px; filter: drop-shadow(0 0 10px rgba(232,196,106,.55)); }
  .decree__sigil .ring { transform-origin: 50% 50%; animation: dcSpin 40s linear infinite; }
  .decree__sigil .ring2 { transform-origin: 50% 50%; animation: dcSpin 26s linear infinite reverse; }
  .decree__sigil .iris { animation: dcPulse 3.2s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes dcSpin { to { transform: rotate(360deg) } }
  @keyframes dcPulse { 0%,100% { opacity: .85; transform: scale(1) } 50% { opacity: 1; transform: scale(1.18) } }
  .decree__eyebrow { font: 500 10px/1 "Cinzel", Georgia, serif; letter-spacing: .42em; text-transform: uppercase; color: var(--blood); filter: brightness(1.5); }
  .decree__title {
    margin: 12px 0 0; font: 900 25px/1.2 "Cinzel Decorative", "Cinzel", Georgia, serif; letter-spacing: .04em; text-transform: uppercase;
    background: linear-gradient(180deg, #fff6d6 0%, var(--gold) 45%, var(--gold2) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.8));
  }
  .decree__rule { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--gold); font-size: 12px; }
  .decree__rule::before, .decree__rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold2)); }
  .decree__rule::after { transform: scaleX(-1); }
  .decree__by { font: italic 600 17px/1.2 "Cormorant Garamond", Georgia, serif; color: #cdbfa0; letter-spacing: .04em; }
  .decree__hh { margin-top: 12px; font: 500 12px/1 "Cinzel", Georgia, serif; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); }
  .decree__name {
    margin: 8px 0 0; font: 900 31px/1.1 "Cinzel Decorative", "Cinzel", Georgia, serif; text-transform: uppercase;
    background: linear-gradient(100deg, var(--gold2) 20%, #fff7da 45%, var(--gold) 55%, var(--gold2) 80%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: dcShine 4.5s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(179,18,43,.7));
  }
  @keyframes dcShine { 0% { background-position: 120% 0 } 100% { background-position: -120% 0 } }
  .decree__titles { margin-top: 16px; font: italic 600 18px/1.45 "Cormorant Garamond", Georgia, serif; color: #e9dcc0; }
  .decree__titles b { display: block; font-weight: 600; color: #ff5c73; letter-spacing: .02em; }
  .decree__btn {
    position: relative; margin-top: 26px; padding: 14px 30px; cursor: pointer; border-radius: 2px;
    font: 700 12px/1 "Cinzel", Georgia, serif; letter-spacing: .32em; text-transform: uppercase; color: #1a0208;
    background: linear-gradient(180deg, #f6dd9a, var(--gold) 50%, var(--gold2)); border: 0;
    box-shadow: 0 0 0 1px #000, 0 0 0 2px var(--gold2), 0 8px 28px -6px rgba(179,18,43,.9);
    transition: transform .15s ease, filter .15s ease;
  }
  .decree__btn:active { transform: scale(.96); filter: brightness(1.15); }
  .decree__titles { cursor: pointer; min-height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .decree__title-swap { min-height: 72px; animation: dcSwap .7s ease-out both; }
  @keyframes dcSwap { from { opacity: 0; transform: translateY(8px); filter: blur(3px) } to { opacity: 1; transform: none; filter: none } }
  .decree__count { margin-top: 6px; font: 500 9px/1 "Cinzel", Georgia, serif; letter-spacing: .3em; text-transform: uppercase; color: #6d5a3a; }
  .decree__humble { margin-top: 18px; font: italic 600 14px/1.3 "Cormorant Garamond", Georgia, serif; color: #b9a67a; letter-spacing: .06em; }
  .decree__humble::before, .decree__humble::after { content: "\2014"; margin: 0 8px; color: var(--gold2); }
  .decree__foot { margin-top: 12px; font: 500 9px/1.4 "Cinzel", Georgia, serif; letter-spacing: .28em; text-transform: uppercase; color: #6d5a3a; }

  @media (max-width: 360px) { .decree__title { font-size: 21px } .decree__name { font-size: 26px } }

    .decree *, .decree { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }

  /* ═══ LO panels + toggle ═══ */
  .lo-panel { display: none; margin: 0 0 16px; padding: 13px 15px 12px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(251,191,36,.10), #0c0c0c 75%);
    border: 1px solid rgba(251,191,36,.35); border-left: 3px solid #fbbf24; }
  body.los-on .lo-panel { display: block; animation: loIn .25s ease; }

  .lo-panel__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .lo-panel__code { font: 700 10px/1 'JetBrains Mono', monospace; color: #fbbf24; letter-spacing: .08em; padding: 3px 7px; border: 1px solid rgba(251,191,36,.45); border-radius: 6px; }
  .lo-panel__topic { font-size: 14px; font-weight: 800; color: #f0f1f5; }
  .lo-panel__tag { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #a98a2c; margin-left: auto; }
  .lo-panel ul { margin: 0; padding: 0; list-style: none; }
  .lo-panel li { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.65; color: #cbd5e1; margin-top: 4px; }
  .lo-panel li::before { content: "\25B8"; color: #fbbf24; flex-shrink: 0; }
  .lo-toggle { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 16px; cursor: pointer; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;

  .lo-toggle--on { color: #fbbf24; background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.7); box-shadow: 0 0 12px -3px rgba(251,191,36,.6); }

  .decree__all-item { display: flex; gap: 10px; width: 100%; padding: 9px 6px; cursor: pointer; background: none; border: 0; border-bottom: 1px solid rgba(168,128,31,.2);
    text-align: left; color: #e9dcc0; font: italic 600 15px/1.35 "Cormorant Garamond", Georgia, serif; }
  .decree__all-item i { font-style: normal; flex: 0 0 24px; font: 500 10px/1.9 "Cinzel", Georgia, serif; color: #6d5a3a; letter-spacing: .08em; }
  .decree__all-item b { color: #ff5c73; font-weight: 600; }
  .decree__all-item--cur { background: rgba(232,196,106,.08); }
  .decree__all-item--cur i { color: var(--gold); }
  .decree__all .decree__btn { margin-top: 14px; padding: 12px 24px; align-self: center; }
  .mcq-q { font-size: 13.5px; line-height: 1.75; color: #e2e8f0; margin: 10px 0 14px; }
  .mcq-meta { display: flex; gap: 8px; align-items: center; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #a98a2c; }
  .mcq-bar { height: 3px; background: #1c1c1c; border-radius: 2px; margin: 8px 0 4px; } .mcq-bar i { display: block; height: 100%; background: #fbbf24; border-radius: 2px; transition: width .3s; }
  .mcq-opt { display: flex; gap: 10px; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; font-size: 12.5px; line-height: 1.55; color: #cbd5e1; background: #0f0f0f; border: 1px solid #262626; }
  .mcq-opt b { color: #fbbf24; flex: 0 0 16px; }
  .mcq-opt--ok { border-color: #22c55e; background: rgba(34,197,94,.12); color: #e8fff0; }
  .mcq-opt--no { border-color: #ef4444; background: rgba(239,68,68,.12); color: #ffecec; }
  .mcq-exp { margin: 12px 0; padding: 12px 14px; border-left: 3px solid #22c55e; background: #0c0c0c; border-radius: 8px; font-size: 12.5px; line-height: 1.7; color: #cbd5e1; }
  .mcq-btn { padding: 11px 22px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 13px; color: #111; background: #fbbf24; border: 0; }
</style>

                        ["The ureter — the single most feared structure in colorectal surgery", "At risk during ligation of the IMA in left-sided/rectal resections, and wherever both ureters cross anterior to the common iliac vessels near the pelvic brim — deliberately identifying and tracing the ureter before dividing major vascular pedicles nearby is standard practice, since ureteric injury can be entirely asymptomatic intraoperatively and only declare itself days later as a urinoma, fistula, or unexplained rising creatinine"],

        upperGI: (React.createElement("div", null,
            React.createElement(SectionIntro, { tag: "Obstruction, Ulcers & Tumors", title: "Esophageal & Gastric Surgery", accent: "#0ea5e9", desc: "Upper GI surgical disease sits at the intersection of two very different problems \u2014 mechanical obstruction of a tube, and mucosal disease of a secretory organ \u2014 and the two frequently converge, since a chronic ulcer can obstruct and an obstructing tumour can ulcerate." }),
            React.createElement(DiseaseCard, { id: "card-0", title: "Benign Obstruction", icon: "\uD83D\uDD34", color: "#0ea5e9" },
                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Chronic gastro-esophageal reflux (often on a background of sliding hiatus hernia, see Anatomy tab) causes recurrent mucosal injury and fibrotic healing at the lower esophagus, progressively narrowing the lumen."),
                React.createElement(Row, { label: "Peptic stricture", val: "Presents with gradually progressive dysphagia, first to solids then liquids, typically in a patient with a long reflux history; managed with endoscopic dilatation and aggressive acid suppression (high-dose proton pump inhibitor) to prevent recurrence, since the stricture will simply re-form if the underlying reflux continues unchecked." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Corrosive stricture", val: "Ingestion of a strong acid or alkali (accidental in children, deliberate in adults) causes acute mucosal necrosis followed by fibrotic stricturing as it heals, often at the natural anatomical narrowings covered on the Anatomy tab \u2014 alkali injury tends to cause deeper liquefactive necrosis than acid injury, which produces a more protective, though still damaging, coagulative eschar; acute management prioritises avoiding induced vomiting (which re-exposes the esophagus to the corrosive on the way back up) and early, cautious endoscopy to grade injury severity, since long-term stricture formation and a markedly increased risk of subsequent esophageal squamous cell carcinoma are both recognised sequelae, sometimes decades later." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Achalasia", val: "Failure of lower esophageal sphincter relaxation combined with loss of normal peristalsis, due to degeneration of inhibitory ganglion cells in the myenteric (Auerbach's) plexus \u2014 the cause of this degeneration is usually idiopathic, though Chagas disease (Trypanosoma cruzi infection destroying the same plexus) produces an identical picture and should be considered in the relevant travel/exposure context. Produces a 'bird's beak' tapering of the distal esophagus on barium swallow with proximal dilatation, and manometry showing absent peristalsis with incomplete LES relaxation confirms the diagnosis. Managed with pneumatic dilatation, surgical Heller's cardiomyotomy (often combined with a partial fundoplication to reduce subsequent reflux), or peroral endoscopic myotomy (POEM) \u2014 all mechanically overcoming the non-relaxing sphincter, since the underlying loss of peristalsis itself cannot be pharmacologically or surgically reversed." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Extrinsic compression and foreign body", val: "Mediastinal masses, an enlarged left atrium (in severe mitral stenosis), or a vascular anomaly (aberrant right subclavian artery \u2014 dysphagia lusoria) can compress the esophagus externally, while food bolus or true foreign body impaction lodges preferentially at the three natural narrowings \u2014 a food bolus impaction with no prior dysphagia history should itself prompt investigation for an underlying stricture or eosinophilic esophagitis once the acute bolus is cleared." }),

                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Classically affects the upper and middle esophagus, strongly associated with smoking and alcohol (synergistic risk when combined, rather than simply additive), and remains the dominant esophageal cancer subtype."),
                React.createElement(H, { color: "#0ea5e9" }, "Two Distinct Subtypes"),
                React.createElement(Row, { c: "#0ea5e9", label: "Squamous cell carcinoma", val: "Worldwide, particularly outside high-income countries \u2014 also the subtype linked to corrosive stricture (above) and achalasia, both of which cause chronic mucosal irritation of native squamous epithelium." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Adenocarcinoma", val: "Classically affects the lower esophagus and gastro-esophageal junction, arising through the Barrett's esophagus sequence, and is now the more common esophageal cancer subtype in many Western populations, reflecting the rising prevalence of obesity and reflux disease." }),

                React.createElement(Row, { c: "#0ea5e9", label: "Scleroderma (systemic sclerosis) oesophagus", val: "Progressive replacement of the smooth muscle in the distal two-thirds of the oesophagus with fibrous tissue produces weak or absent peristalsis there, while the proximal, striated-muscle third (under different neuromuscular control) is relatively spared \u2014 combined with a low, incompetent lower oesophageal sphincter pressure, this produces severe reflux disease and an oesophagus that empties poorly by gravity alone, a distinctive combination that should prompt consideration of underlying systemic sclerosis, particularly alongside other suggestive features (Raynaud's, skin changes, sclerodactyly)." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83E\uDDED" }, "A Structured Approach to Dysphagia"),

                        ["Solid-only vs solid-and-liquid dysphagia", "Solids only, particularly if progressive, points toward a mechanical/structural cause (stricture, tumour, ring), since a food bolus of sufficient size is needed to trigger symptoms. Both solids and liquids from the outset points toward a motility disorder (achalasia or the conditions above), since these affect coordinated muscular passage regardless of consistency"],

                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "Accounts for the majority of peptic ulcers overall, colonising the gastric antral mucosa and disrupting the normal mucus-bicarbonate protective barrier while also driving chronic gastritis \u2014 duodenal ulcers are more."),
                React.createElement(Row, { label: "H. pylori", val: "Strongly H. pylori-associated than gastric ulcers, and eradication therapy (a proton pump inhibitor plus two antibiotics, typically amoxicillin and clarithromycin, or metronidazole in penicillin allergy) both heals the ulcer and dramatically reduces recurrence compared with acid suppression alone." }),
                React.createElement(Row, { c: "#0ea5e9", label: "NSAIDs", val: "Reduce mucosal defence by inhibiting COX-1-mediated protective prostaglandin synthesis (which normally stimulates mucus and bicarbonate secretion and maintains mucosal blood flow) \u2014 risk rises with dose, duration, concurrent corticosteroid or anticoagulant use, and age, and co-prescription of a proton pump inhibitor is standard practice when NSAIDs cannot be avoided in at-risk patients." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Zollinger-Ellison syndrome", val: "A gastrin-secreting neuroendocrine tumour (gastrinoma), most often in the duodenum or pancreas, drives extreme, unregulated gastric acid hypersecretion \u2014 should be suspected with multiple, recurrent, or unusually distal (post-bulbar/jejunal) ulcers, ulcers resistant to standard therapy, or associated diarrhoea (from acid-mediated inactivation of pancreatic enzymes and direct mucosal injury); a fasting serum gastrin level (off proton pump inhibitors, which themselves raise gastrin) is the key screening test, and roughly a quarter of cases occur as part of MEN1 syndrome alongside parathyroid and pituitary tumours." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Duodenal vs gastric ulcer \u2014 a clinically useful distinction", val: "Duodenal ulcer pain classically improves with eating (food buffers acid reaching the already-healed duodenal mucosa) and recurs a few hours later as the stomach empties; gastric ulcer pain classically worsens with eating (food stimulates acid secretion against an already-compromised gastric mucosal barrier) \u2014 this distinction is a useful clinical heuristic though it is not reliable enough alone to avoid endoscopic confirmation." }),

                React.createElement(Box, { color: "#0ea5e9", title: "Overview" }, "A duodenal (more common) or gastric ulcer erodes fully through the wall, spilling gastric content into the peritoneal cavity and producing sudden, severe abdominal pain rapidly becoming generalised, with a rigid."),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83D\uDCA5" }, "Perforation"),
                React.createElement(Row, { c: "#0ea5e9", label: "Presentation and confirmation", val: "Board-like abdomen \u2014 an erect chest X-ray showing free sub-diaphragmatic air confirms the diagnosis in the majority of cases, though a normal film does not exclude it, and CT is more sensitive if the diagnosis remains uncertain." }),
                React.createElement(Row, { c: "#0ea5e9", label: "Management", val: "Resuscitation (IV fluids, broad-spectrum antibiotics, analgesia, nasogastric decompression) proceeds in parallel with urgent surgical assessment; surgical repair is most often an omental (Graham) patch over the perforation rather than formal ulcer resection in the acute setting, since the priority is source control in a physiologically stressed patient rather than definitive ulcer surgery, which can be addressed medically (H. pylori eradication, acid suppression) once the patient has recovered." }),
                React.createElement(SubHead, { color: "#0ea5e9", icon: "\uD83E\uDE78" }, "Bleeding"),

                React.createElement(Row, { c: "#0ea5e9", label: "Risk stratification", val: "The Glasgow-Blatchford score, calculated from clinical and simple laboratory data (urea, haemoglobin, systolic BP, pulse, and the presence of melaena/syncope/hepatic disease/cardiac failure) before endoscopy, identifies patients at very low risk who may be safely managed as outpatients without admission; the Rockall score, incorporating endoscopic findings alongside clinical data, stratifies risk of rebleeding and mortality after endoscopy and guides the intensity of post-endoscopic monitoring." }),

["S2-019","A 27-year-old woman has 18 months of dysphagia to solids and liquids from the outset, regurgitation of undigested food and 6 kg weight loss. Endoscopy shows a dilated, food-filled oesophagus with no mucosal lesion; barium shows a bird's beak. Which test confirms the diagnosis?",["24-hour pH monitoring","High-resolution manometry","CT chest with contrast","Repeat endoscopy with GOJ biopsies","Serum anti-parietal cell antibodies"],1,"Manometry shows incomplete LES relaxation with absent peristalsis. Endoscopy/EUS excludes pseudoachalasia from a GOJ tumour. Treatment: Heller myotomy with partial fundoplication, POEM or pneumatic dilatation."],
["S2-019","A 52-year-old man has severe retrosternal pain and neck crepitus after violent vomiting following a binge. At 8 hours: HR 118, T 38.6 C, left pleural effusion, and a water-soluble swallow shows a leak into the left chest. Best management?",["Nil by mouth, PPI and antibiotics alone","Nasogastric tube and observation","Pleural aspiration and review at 24 hours","Urgent repair with buttress, wide pleural drainage and broad-spectrum antibiotics","Immediate oesophagectomy"],3,"Boerhaave (distal left posterolateral tear) with sepsis and pleural contamination within 24 hours: primary repair reinforced with a flap or patch, plus drainage. Non-operative care or stenting suits contained, stable, minimally contaminated cases; resection is for extensive necrosis or underlying malignancy."],
["S2-020","A 61-year-old man on omeprazole for 4 weeks presents with haematemesis. Endoscopy shows a 1.5 cm clean-based lesser-curve gastric ulcer; biopsies are taken and the rapid urease test is negative. What is the most appropriate interpretation?",["H. pylori is excluded; no further testing","Likely false negative (PPI, bleeding); confirm with serology or repeat testing, and plan repeat endoscopy to confirm healing","Start eradication only if the ulcer fails to heal","H. pylori is irrelevant to gastric ulcers","Proceed to vagotomy and drainage"],1,"PPIs, recent antibiotics and bleeding reduce sensitivity of urease, breath and stool tests; serology is unaffected (but cannot prove cure). Gastric ulcers need repeat endoscopy with biopsies at 6-8 weeks to confirm healing and exclude malignancy."],
["S2-020","A 74-year-old man with a posterior duodenal bulb ulcer and a spurting vessel receives adrenaline and clips. Twenty hours later he rebleeds with BP 85/50 despite resuscitation. Which vessel is the likely source and what is the best next step?",["Right gastric artery; observe","Left gastric artery; urgent splenectomy","Gastroduodenal artery; repeat endoscopic therapy, then angioembolisation or surgery if it fails","Superior pancreaticoduodenal vein; transfusion only","Inferior pancreaticoduodenal artery; PPI infusion only"],2,"Posterior bulb ulcers erode the GDA. After rebleeding, a second endoscopic attempt is standard; if it fails or he remains unstable, proceed to angioembolisation or surgery (duodenotomy with three-point underrunning of the GDA)."],
["S2-021","A 71-year-old woman with a large hiatus hernia develops sudden severe epigastric pain, unproductive retching and cannot have a nasogastric tube passed. CXR shows a retrocardiac gas-fluid level; she is haemodynamically stable. Best management?",["Elective repair after outpatient review","Barium meal and observe for 48 hours","Endoscopic detorsion and discharge","Total gastrectomy regardless of viability","Urgent surgery: reduce and detorse, assess viability, repair hernia with gastropexy"],4,"Borchardt's triad indicates acute gastric volvulus, an emergency because of ischaemia and perforation risk. Reduce, check viability (resect only if necrotic), repair the hernia and fix the stomach. Endoscopic decompression is a bridge in high-risk patients."],
["S2-021","A 67-year-old man on long-term NSAIDs has peritonitis with free air on erect CXR. At laparotomy there is a 3 cm perforation on the lesser curve with indurated edges. What is the most important additional step?",["Graham omental patch alone","Truncal vagotomy and pyloroplasty","Biopsy or excision of the ulcer edge with repair, then H. pylori testing and stopping NSAIDs","Lavage and closure without repair","Immediate total gastrectomy"],2,"A perforated gastric ulcer may be malignant, so biopsy or excise it. Patch-only repair suits duodenal ulcers; very large or unsuitable ulcers may need resection."],
["S2-022","A 55-year-old woman has a 6 cm gastric mass. EUS shows a hypoechoic lesion arising from the muscularis propria; biopsy shows spindle cells positive for CD117 and DOG1. CT shows no metastases. Best treatment?",["D2 gastrectomy with extended lymphadenectomy","Complete resection with negative margins (e.g. wedge), no routine lymphadenectomy","Neoadjuvant chemoradiotherapy","Imatinib alone indefinitely","Yearly surveillance endoscopy"],1,"GISTs spread haematogenously and rarely to nodes. Aim for R0 resection without tumour rupture. Neoadjuvant imatinib is for borderline-resectable disease; adjuvant imatinib depends on size, mitotic rate, site and rupture."],
["S2-022","A 63-year-old man has T3N1 distal gastric adenocarcinoma on CT and EUS with no visible distant disease. Which investigation best avoids a non-therapeutic laparotomy?",["Serum CEA","Bone scan","Repeat CT with oral contrast","Staging laparoscopy with peritoneal washings","Gastric lavage cytology"],3,"CT misses small peritoneal and liver deposits; positive washings mean stage IV. If resectable, perioperative chemotherapy with D2 gastrectomy is standard."],
["S2-022","A 49-year-old woman with dyspepsia has biopsies showing low-grade gastric MALT lymphoma confined to the mucosa and submucosa. She is H. pylori positive and t(11;18) negative. First-line treatment?",["Total gastrectomy","R-CHOP chemotherapy","H. pylori eradication therapy","Gastric radiotherapy","Splenectomy"],2,"Eradication induces remission in most early H. pylori-positive cases; t(11;18) predicts non-response. Follow with endoscopy and biopsy; use radiotherapy or rituximab if persistent, and surgery only for complications."],
["S2-018","During a laparoscopic fundoplication, a surgeon creates the retro-oesophageal window with blunt dissection. Which structure, lying against the right posterolateral oesophageal wall near the right crus, is at greatest risk, causing postoperative gastric stasis if injured?",["Left phrenic nerve","Posterior vagal trunk","Thoracic duct","Coeliac ganglion","Left gastric artery"],1,"The posterior vagal trunk runs behind the oesophagus close to the right crus; the anterior trunk sits on the anterior wall. Identify and keep both on the oesophagus when wrapping."],
["S2-019","A 72-year-old woman has regurgitation of undigested food, halitosis, a gurgling sound in the neck and intermittent dysphagia, without weight loss. What is the best initial investigation?",["Blind rigid endoscopy","Oesophageal manometry","24-hour pH monitoring","CT neck","Contrast swallow, with endoscopy only with great caution"],4,"Features of a pharyngeal (Zenker) pouch. A contrast swallow shows the pouch; endoscopy risks perforating it. Definitive treatment is surgical or endoscopic diverticulotomy with cricopharyngeal myotomy."],
["S2-019","An 18-hour-old alkali ingestion presents with drooling and dysphonia but a stable airway. After airway assessment and resuscitation, what is the most appropriate next step?",["Induce vomiting","Neutralise with a weak acid","Early endoscopy to grade the injury","Immediate barium swallow","Blind nasogastric lavage"],2,"Never induce emesis or neutralise. Endoscopy within roughly 12-48 hours grades injury and guides management; avoid it in suspected perforation. Late stricture and squamous carcinoma risk need follow-up."],
["S2-019","A 56-year-old man with long-standing reflux has a 4 cm Barrett segment with a visible nodule. Biopsies show high-grade dysplasia confirmed by two expert pathologists. Best management?",["Lifelong PPI and annual surveillance","Immediate oesophagectomy","Gastric fundoplication","Endoscopic resection of the nodule then radiofrequency ablation","Neoadjuvant chemoradiotherapy"],3,"EMR of visible lesions gives accurate T staging and treatment; ablation then eradicates residual metaplasia. Oesophagectomy is reserved for deeper invasion or failure."],
["S2-019","A fit 60-year-old man has a mid-oesophageal squamous cell carcinoma, T3N1 on EUS, with no distant disease. What is the standard curative approach?",["Neoadjuvant chemoradiotherapy then oesophagectomy","Surgery alone","Endoscopic mucosal resection","Palliative stenting","Oesophageal bypass"],0,"Locally advanced resectable disease benefits from multimodal therapy (e.g. CROSS-type chemoradiotherapy). Definitive chemoradiotherapy is an option for proximal tumours or poor surgical candidates."],
["S2-019","A 78-year-old man with unresectable stage IV oesophageal cancer and an expected survival under 3 months has severe dysphagia. Which option gives the fastest sustained relief?",["Oesophagectomy","Gastrostomy tube alone","Repeated bougie dilatation","Radiotherapy alone","Self-expanding metal stent"],4,"A stent relieves dysphagia within days. Brachytherapy or radiotherapy act more slowly but last longer. Complications include migration, perforation, reflux and tumour overgrowth."],
["S2-020","A penicillin-allergic man with a duodenal ulcer is H. pylori positive and treatment-naive. Which first-line regimen is most appropriate?",["PPI, bismuth, tetracycline and metronidazole for 14 days","PPI, amoxicillin and clarithromycin for 7 days","PPI alone for 8 weeks","Clarithromycin monotherapy","PPI and levofloxacin for 3 days"],0,"Bismuth quadruple therapy avoids penicillin and is a preferred first line. Confirm eradication at least 4 weeks after therapy and 2 weeks off PPI."],
["S2-020","A 68-year-old man with chronic duodenal ulcer disease has repeated large-volume vomiting of food eaten days earlier, a succussion splash and hypochloraemic, hypokalaemic metabolic alkalosis. What is the best initial step?",["Immediate gastrojejunostomy","IV PPI only","Barium meal","NG decompression with IV saline and potassium replacement","Urgent vagotomy"],3,"Gastric outlet obstruction first needs decompression and correction of fluid and electrolytes. Endoscopy with biopsy then excludes malignancy; dilatation or surgery (gastrojejunostomy or antrectomy) follows."],
["S2-020","A 45-year-old man with free air has a 6-hour history of perforation of a duodenal ulcer, is stable and has localised peritonitis. Which management is correct?",["Routine highly selective vagotomy","Billroth II gastrectomy","Taylor's non-operative regimen in all patients","Total gastrectomy","Omental patch repair with lavage, then H. pylori eradication"],4,"Omental (Graham) patch repair, laparoscopic where possible, is standard; treat H. pylori and stop NSAIDs. Acid-reducing surgery is rarely needed today."],
["S2-021","A 79-year-old woman has sudden epigastric pain and tenderness; erect chest radiograph shows no free air. She is stable and perforation is strongly suspected. What is the best next investigation?",["Repeat chest radiograph in 6 hours","Serum amylase only","CT abdomen with contrast","Barium meal","Diagnostic endoscopy"],2,"Plain films miss a proportion of free air. CT confirms perforation and its level. Avoid endoscopic insufflation and barium in suspected perforation."],
["S2-021","Which statement about gastric volvulus is correct?",["Organoaxial rotation is commoner, usually accompanies a diaphragmatic defect and carries a higher strangulation risk","Mesenteroaxial volvulus is always acute and fatal","Gastric volvulus never occurs without a hiatus hernia","It is diagnosed best by endoscopy alone","Treatment is always conservative"],0,"Organoaxial rotation (around the cardia-pylorus axis) is the most frequent and is the type linked to strangulation. Mesenteroaxial volvulus rotates around the short axis and is often chronic or partial."],
["S2-022","A 28-year-old woman with a CDH1 pathogenic variant and several relatives with diffuse gastric cancer has a normal endoscopy. What is the recommended management?",["Prophylactic total gastrectomy","Yearly CT","Eradication of H. pylori alone","Distal gastrectomy","Neoadjuvant chemotherapy"],0,"CDH1 variants give a very high lifetime risk of signet-ring diffuse cancer that endoscopy often misses. Prophylactic total gastrectomy is advised, with counselling."],
["S2-022","A 62-year-old has a 1.5 cm well-differentiated, non-ulcerated mucosal intestinal-type gastric adenocarcinoma on endoscopy and EUS with no nodal disease. Best treatment?",["D2 total gastrectomy","Subtotal gastrectomy","Palliative chemotherapy","Observation","Endoscopic submucosal dissection"],4,"Small, differentiated, non-ulcerated mucosal lesions have a negligible nodal risk. ESD allows en-bloc resection; surgery is needed if histology shows deeper invasion or lymphovascular spread."],
["S2-022","In gastric cancer, which finding alone upstages disease to M1 (stage IV)?",["Perigastric nodal involvement","Serosal invasion","Positive peritoneal washing cytology","Splenic hilar nodes","Omental invasion"],2,"Positive cytology counts as distant metastatic disease. Nodes are N staging; serosal invasion is T4a."],
["S2-018","A surgeon plans to ligate the left gastric artery at its origin during a gastrectomy. Which step best avoids ischaemic injury to the left liver?",["Check the gastrohepatic ligament for a replaced left hepatic artery and preserve it if present","Ligate flush with the coeliac trunk in every case","Divide the gastrohepatic ligament blindly with diathermy","Clamp the proper hepatic artery first","Ligate only after splenectomy"],0,"A replaced or accessory left hepatic artery arises from the left gastric artery in roughly 10-15% of patients. Look for pulsation in the ligament and test-clamp before dividing."],
["S2-018","After a three-stage oesophagectomy with a cervical anastomosis, a patient has a hoarse voice and a weak cough. Which injury is most likely, and why?",["Right vagus nerve, as it lies to the right of the oesophagus","Phrenic nerve, adjacent to the pericardium","Sympathetic chain behind the pleura","Left recurrent laryngeal nerve, which loops under the aortic arch and ascends in the tracheo-oesophageal groove","Superior laryngeal nerve, which runs with the superior thyroid artery"],3,"The left RLN has a long course beside the oesophagus and is vulnerable to traction, thermal injury, ischaemia and nodal dissection."],
["S2-018","Which nodal group is first-echelon drainage for a distal greater-curve gastric tumour and must be cleared in a distal gastrectomy?",["Para-aortic nodes","Splenic hilar nodes","Left gastric nodes only","Retropancreatic nodes only","Infrapyloric nodes along the right gastroepiploic vessels"],4,"The distal greater curve drains along the right gastroepiploic vessels to infrapyloric nodes. D2 dissection also clears the left gastric, hepatic artery, coeliac and splenic artery stations; splenic hilar nodes matter for proximal greater-curve tumours."],
["S2-019","On day 3 after oesophagectomy, a chest drain yields 900 mL/day of milky fluid. Which test confirms the diagnosis?",["Pleural fluid amylase","Pleural fluid pH","Pleural fluid triglyceride above 1.24 mmol/L","Pleural fluid LDH","Serum albumin"],2,"This is a chyle leak from thoracic duct injury. Initial treatment is fasting or a medium-chain-triglyceride diet with drainage (octreotide sometimes); persistent high output needs thoracic duct ligation."],
["S2-019","A 76-year-old woman has postprandial chest pain, early satiety and iron-deficiency anaemia. CT shows a type III (paraoesophageal) hiatus hernia with the fundus in the chest. Best management?",["Elective laparoscopic repair with sac excision, crural closure and gastropexy or fundoplication","Observation, since these hernias never complicate","PPI and iron alone","Open total gastrectomy","Endoscopic clipping of the hernia"],0,"Symptomatic type III hernias should be repaired because of the risk of obstruction, volvulus and strangulation; the anaemia suggests Cameron lesions. Asymptomatic patients may be watched."],
["S2-019","A 24-year-old man with asthma and eczema has recurrent solid-food impaction. Endoscopy shows concentric rings and linear furrows. What is the most appropriate next step?",["Immediate pneumatic dilatation","Multiple biopsies from proximal and distal oesophagus","Heller myotomy","Barium swallow only","Anti-reflux surgery"],1,"This is eosinophilic oesophagitis; diagnosis needs biopsies (15 or more eosinophils per high-power field) even if mucosa looks normal. Treat with PPI, topical steroids or diet; dilate cautiously."],
["S2-019","A patient develops neck pain, crepitus and fever 6 hours after a difficult endoscopy. A contrast swallow shows a small contained cervical oesophageal leak and he is stable. Best management?",["Immediate oesophagectomy","Thoracotomy and primary repair","Early oral feeding with analgesia","Nil by mouth, antibiotics and nutrition, with drainage if a collection forms","Observation with no antibiotics"],3,"Small contained cervical leaks usually heal with conservative treatment. Operate for collections, sepsis or mediastinal extension."],
["S2-020","A 65-year-old man with a bleeding gastric ulcer must continue low-dose aspirin for coronary stents. What is the best strategy?",["Stop aspirin permanently","Continue aspirin without gastroprotection","Continue aspirin with PPI cover, test and eradicate H. pylori, and restart early once haemostasis is secure","Replace aspirin with ibuprofen","Perform vagotomy"],2,"Stopping aspirin in stented patients risks thrombosis, and early restart has benefit. PPI plus H. pylori eradication lowers rebleeding."],
["S2-020","A 44-year-old man has recurrent ulcers in the second part of the duodenum and jejunum despite PPI, with chronic diarrhoea. Which test is most appropriate?",["Fasting serum gastrin with gastric pH, and secretin stimulation if equivocal","Serum CEA","Urea breath test only","Faecal calprotectin","Serum lipase"],0,"Suspect a gastrinoma (Zollinger-Ellison). PPIs raise gastrin, so interpret carefully; localise the tumour and screen for MEN1."],
["S2-020","At endoscopy for melaena, a duodenal ulcer shows a non-bleeding visible vessel. What is the best approach?",["Observation only","Oral PPI and early discharge","Argon plasma coagulation alone","Immediate surgery","Combination endoscopic therapy (e.g. adrenaline plus clips), then high-dose IV PPI for 72 hours"],4,"A non-bleeding visible vessel (Forrest IIa) is a high-risk stigma. A clean base or flat spot needs no endoscopic therapy."],
["S2-020","Fifteen minutes after meals following a distal gastrectomy, a patient has palpitations, flushing, diarrhoea and cramps. What is the first-line management?",["Immediate revision to Roux-en-Y","Small frequent low-carbohydrate meals, separating fluids from solids","Large high-sugar meals","Prolonged fasting","Prokinetics"],1,"Early dumping responds to dietary change in most patients. Acarbose or octreotide is used if refractory; revision surgery is rarely needed."],
["S2-021","Which three factors make up the Boey score used to predict mortality after perforated peptic ulcer?",["Age, sex and smoking","Haemoglobin, white cell count and CRP","Ulcer size, site and H. pylori status","Preoperative shock, major medical illness and perforation for more than 24 hours","Pneumoperitoneum, ascites and fever"],3,"Each factor adds risk; with none, mortality is low, and it rises sharply with all three."],
["S2-021","A 70-year-old woman has postprandial epigastric pain and early satiety. A barium meal shows a long-standing upside-down stomach. She is stable with no ischaemia. Best management?",["Emergency laparotomy","Lifelong PPI only","Elective laparoscopic reduction, hernia repair and gastropexy","Subtotal gastrectomy","Endoscopic dilatation"],2,"Chronic intermittent volvulus with a paraoesophageal hernia can be repaired electively. Reduce, repair the defect and fix the stomach."],
["S2-022","Which feature best fits intestinal-type gastric adenocarcinoma rather than the diffuse type?",["Occurs in young patients with CDH1 mutation","Association with H. pylori-driven atrophy and intestinal metaplasia","Linitis plastica","Single infiltrating signet-ring cells","Equal sex distribution with no precursor lesion"],1,"The intestinal type follows the Correa cascade and tends to be distal and older-onset; the diffuse type is younger, CDH1-related and has a worse prognosis."],
["S2-022","A 68-year-old with an unresectable obstructing distal gastric cancer and liver metastases has persistent vomiting and an expected survival of about 6 months. What is the best palliation of outlet obstruction?",["Duodenal or pyloric stent regardless of prognosis","Total gastrectomy","Palliative radiotherapy alone","Gastrojejunostomy; stents suit very short life expectancy","Repeated endoscopic dilatation"],3,"Stents relieve vomiting faster but obstruct again more often. Gastrojejunostomy gives longer-lasting relief if survival exceeds a few months."],
["S2-022","A 58-year-old has a bulky gastric ulcer; biopsy shows diffuse large B-cell lymphoma, Lugano stage II. First-line treatment?",["Total gastrectomy","H. pylori eradication alone","Observation","Splenectomy","R-CHOP-type chemoimmunotherapy"],4,"Unlike low-grade MALT lymphoma, DLBCL needs systemic therapy. Surgery is reserved for complications such as perforation or bleeding."],
["S2-022","A 32-year-old with FAP has Spigelman stage IV duodenal polyposis. Which is most appropriate?",["Annual surveillance only","Duodenal surgery (pancreas-preserving duodenectomy or pancreaticoduodenectomy)","Endoscopic removal of every polyp","Total colectomy alone","PPI therapy"],1,"Stage IV carries a high risk of duodenal cancer. Lower stages are managed with surveillance and endoscopic therapy; colectomy does not address the duodenum."],
["S2-022","A 52-year-old woman with pernicious anaemia has several 6 mm gastric polyps; biopsy shows well-differentiated neuroendocrine tumours with markedly raised gastrin. Best management?",["Total gastrectomy","Chemotherapy","Radiotherapy","Endoscopic resection with surveillance","Octreotide alone"],3,"This is a type 1 gastric NET driven by hypergastrinaemia from achlorhydria, which is usually indolent. Type 2 occurs with gastrinoma/MEN1; type 3 is sporadic and needs oncological resection."],
["S2-018","Which structures traverse the oesophageal hiatus (T10) alongside the oesophagus?",["Thoracic duct and azygos vein","IVC and right phrenic nerve","Anterior and posterior vagal trunks","Aorta and thoracic duct","Splanchnic nerves"],2,"The hiatus, formed by fibres of the right crus, transmits the oesophagus, both vagal trunks and oesophageal branches of the left gastric vessels. The IVC passes at T8; the aorta, thoracic duct and azygos vein pass through the aortic hiatus at T12."],
["S2-018","Which arteries supply the abdominal oesophagus and gastro-oesophageal junction?",["Oesophageal branches of the left gastric artery and left inferior phrenic artery","Inferior thyroid artery","Direct branches of the thoracic aorta only","Right gastric artery","Superior mesenteric artery"],0,"Oesophageal supply is segmental: inferior thyroid (cervical), aortic branches (thoracic), left gastric and inferior phrenic (abdominal). This fragile, segmental supply is why anastomoses and conduits leak."],
["S2-019","A 34-year-old has episodic dysphagia to solids and liquids from the outset with chest pain. Endoscopy is normal and barium shows a corkscrew pattern. Most likely diagnosis?",["Peptic stricture","Carcinoma","Schatzki ring","Diffuse oesophageal spasm","Pharyngeal pouch"],3,"Solids and liquids affected together from onset point to a motility disorder rather than mechanical narrowing. Manometry shows premature contractions; achalasia instead shows incomplete LES relaxation."],
["S2-019","A GP's barium swallow shows a 4 cm irregular stricture in a 59-year-old with progressive solid dysphagia and weight loss. Why is endoscopy still required?",["Barium cannot show strictures","It gives biopsy for histology and direct assessment of the mucosa, which contrast cannot","It replaces CT staging","Barium is contraindicated in malignancy","It measures depth through every layer"],1,"Contrast shows shape, not tissue. Endoscopy confirms histology and mucosal extent (including Barrett's); staging still needs EUS and CT."],
["S2-019","In which situation is a contrast swallow best performed before endoscopy?",["Melaena","Haematemesis","Weight loss with dysphagia","Dyspepsia in a young patient","Suspected pharyngeal pouch with recurrent aspiration"],4,"Blind passage of the endoscope risks perforating a pouch, and contrast maps its anatomy first. For most other dysphagia, endoscopy comes first."],
["S2-019","EUS shows an oesophageal tumour invading the muscularis propria but not the adventitia, with no nodal disease. What is the T stage?",["T1b","T3","T4a","T2","Tis"],3,"T1b is submucosa, T2 muscularis propria, T3 adventitia, T4a adjacent resectable structures such as pleura or diaphragm."],
["S2-019","Which statement about T staging is correct?",["In hollow organs T is based mainly on tumour size in cm","Gastric T4a is invasion of the subserosa","In solid organs such as breast, T is based mainly on size","Oesophageal T1b is invasion of the lamina propria","Oesophageal T3 is invasion of the muscularis propria"],2,"Solid organs lack wall layers, so size drives T. Hollow organs use depth: gastric T3 is subserosa and T4a is serosa; oesophageal T1b is submucosa and T3 is adventitia."],
["S2-019","A contrast swallow is requested for suspected oesophageal perforation. Which agent is appropriate first, and why?",["Water-soluble (isosmolar) contrast, because barium in the mediastinum causes severe inflammation","Barium, because it gives better detail and is harmless outside the lumen","Air only","Oral methylene blue","No contrast; endoscopy first in all cases"],0,"Use water-soluble contrast first, preferring an isosmolar agent if aspiration is possible. CT with oral contrast is an alternative; a negative study can be repeated with dilute barium for sensitivity."],
["S2-020","Which barium meal appearance favours a malignant gastric ulcer?",["Crater projecting beyond the expected gastric contour","Smooth round crater with radiating folds reaching its edge","Hampton's line at the ulcer neck","Smooth regular edges on the lesser curve","Ulcer within a mass, with heaped irregular margins and clubbed or fused folds"],4,"Benign ulcers project outside the lumen with smooth edges and radiating folds. Malignant ulcers sit within the lumen contour inside a mass. Biopsy any gastric ulcer regardless."],
["S2-020","Which physiological pattern is typical of H. pylori antral-predominant gastritis causing duodenal ulcer?",["Low acid output with gastric atrophy","Reduced gastrin with high somatostatin","Normal acid with intact bicarbonate","Raised gastrin and acid output, with gastric metaplasia in the duodenal bulb","Pernicious anaemia"],3,"Antral infection reduces D-cell somatostatin, raising gastrin and acid; gastric metaplasia in the bulb lets H. pylori colonise it. Pangastritis with atrophy and low acid predisposes to gastric ulcer and cancer instead."],
["S2-020","A gastric ulcer has not healed after 12 weeks of PPI. What is the best next step?",["Double the PPI and wait another 12 weeks","Truncal vagotomy","Repeat endoscopy with multiple biopsies, and review NSAID use, H. pylori status and gastrinoma","Barium meal alone","Add misoprostol and discharge"],2,"Non-healing means malignancy, persistent H. pylori, covert NSAID use or hypersecretion until proven otherwise."],
["S2-020","A 70-year-old on regular diclofenac develops a gastric ulcer. Which mechanism is mainly responsible?",["COX-1 inhibition lowering mucosal prostaglandins, mucus, bicarbonate and blood flow","Direct stimulation of parietal cells","Increased gastrin from antral G cells","Bile reflux","Loss of intrinsic factor"],0,"NSAIDs impair prostaglandin-mediated mucosal defence. Risk rises with age, steroids, anticoagulants and H. pylori."],
["S2-021","A 78-year-old on long-term prednisolone has a perforated gastric ulcer but only mild tenderness and no rigidity. What is the key lesson?",["Perforation is excluded","Repeat examination only after 24 hours","Steroids always cause duodenal ulcers","Antibiotics are unnecessary","Steroids and age blunt peritoneal signs, so keep a low threshold for CT and early surgery"],4,"Immunosuppression and age mask peritonism and delay diagnosis, which raises mortality."],
["S2-021","Which radiological finding is characteristic of acute organoaxial gastric volvulus?",["Single small air-fluid level in the antrum","Double air-fluid level (cardia and antrum) with a beak at the twist","Dilated caecum","Rigler's sign only","Normal stomach position with air under the diaphragm"],1,"Two air-fluid levels with a dilated stomach and a point of obstruction, usually with failure to pass an NG tube. CT confirms the twist and looks for ischaemia."],
["S2-021","Which finding points to oesophageal rather than gastric perforation?",["Board-like abdominal rigidity only","Free air under the diaphragm only","Pneumoperitoneum with absent bowel sounds","Mediastinal emphysema with a crunch synchronous with the heartbeat (Hamman's sign)","Raised serum lipase only"],3,"Mediastinal air and neck crepitus indicate oesophageal perforation; free peritoneal air with generalised peritonitis suggests gastroduodenal perforation."],
["S2-022","A tumour has its centre 3 cm below the gastro-oesophageal junction (Siewert III) with no distant disease. Which operation is typically planned?",["Ivor Lewis oesophagectomy","Proximal gastrectomy only","Total gastrectomy with D2 lymphadenectomy","Distal gastrectomy","Endoscopic resection"],2,"Siewert I (1-5 cm above the GOJ) is managed by oesophagectomy; II (1 cm above to 2 cm below) by either approach; III (2-5 cm below) as gastric cancer, usually total gastrectomy."],
["S2-022","Which GIST genotype is classically resistant to imatinib?",["PDGFRA D842V","KIT exon 11 mutation","KIT exon 9 mutation","Any CD117-positive tumour","Any tumour over 5 cm"],0,"KIT exon 11 is most sensitive, KIT exon 9 needs a higher dose, and PDGFRA D842V is intrinsically resistant. Adjuvant therapy is chosen by risk (size, mitoses, site, rupture) and genotype."],
["S2-022","A 66-year-old with weight loss and an epigastric mass has a hard left supraclavicular node. What does it imply?",["Benign reactive node","Resectable stage II disease","An indication for splenectomy","Early gastric cancer","Metastatic disease (Virchow's node, M1); curative resection is not appropriate"],4,"Virchow's node reflects distant nodal spread via the thoracic duct. Confirm with biopsy and stage; treatment becomes palliative or systemic."],
];
MCQS.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
function McqQuiz() {
    const h = React.createElement, L = "ABCDE";
    const [i, setI] = useState(0), [pick, setPick] = useState(null), [score, setScore] = useState(0);
    if (i >= MCQS.length) return h("div", { style: { textAlign: "center", padding: "40px 10px" } },
        h("div", { style: { fontSize: 38, fontWeight: 800, color: "#fbbf24" } }, score + " / " + MCQS.length),
        h("div", { className: "mcq-q" }, score >= MCQS.length * 0.8 ? "Strong performance." : "Revisit the explanations and the topic cards."),
        h("button", { className: "mcq-btn", onClick: () => { setI(0); setPick(null); setScore(0); } }, "Restart"));
    const q = MCQS[i], done = pick !== null;
    return h("div", null,
        h("div", { className: "mcq-meta" }, h("span", null, "Q" + (i + 1) + " / " + MCQS.length), h("span", { className: "lo-panel__code" }, q[0]), h("span", { style: { marginLeft: "auto" } }, "Score " + score)),
        h("div", { className: "mcq-bar" }, h("i", { style: { width: (i / MCQS.length * 100) + "%" } })),
        h("div", { className: "mcq-q" }, q[1]),
        q[2].map((o, k) => h("button", { key: k, disabled: done,
            className: "mcq-opt" + (done && k === q[3] ? " mcq-opt--ok" : done && k === pick ? " mcq-opt--no" : ""),
            onClick: () => { setPick(k); if (k === q[3]) setScore(score + 1); } }, h("b", null, L[k]), h("span", null, o))),
        done && h("div", { className: "mcq-exp" }, h("b", null, pick === q[3] ? "Correct. " : "Answer: " + L[q[3]] + ". "), q[4]),
        done && h("button", { className: "mcq-btn", onClick: () => { setI(i + 1); setPick(null); } }, i + 1 < MCQS.length ? "Next" : "Finish"));
